<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#163a5f">
    <title>ระบบบริหารงานซ่อมบำรุง | MTA Asset</title>
    <link rel="icon" type="image/png" href="./Logo.png">
    
    <!-- แก้ไขลิงก์ Tailwind เป็น CDN -->
    <script src="./tailwind.js"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #f4f6f8;
            --surface: #ffffff;
            --surface2: #f1f4f7;
            --border: #d7dde5;
            --accent: #163a5f;
            --accent2: #0e273f;
            --green: #146c43;
            --orange: #b5651d;
            --red: #a4262c;
            --yellow: #8a6d1a;
            --text: #1c2230;
            --text2: #5a6273;
            --text3: #9aa1b0;
        }

        * { box-sizing: border-box; }
        body { 
            font-family: 'Sarabun', sans-serif; 
            background: var(--bg); 
            color: var(--text);
            -webkit-tap-highlight-color: transparent; 
            overflow: hidden;
            height: 100vh;
            margin: 0;
        }
        button, input, select, textarea { font: inherit; }
        button { border: 0; }
        
        .mono { font-family: 'IBM Plex Mono', monospace; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text3); }

        /* Animations */
        @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        @keyframes slideIn { from { opacity:0; transform:translateX(-20px); } to { opacity:1; transform:translateX(0); } }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.5; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes shimmer { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }
        @keyframes ping { 0% { transform: scale(1); opacity: 1; } 75%,100% { transform: scale(2); opacity: 0; } }
        @keyframes modalIn { from { opacity:0; transform:scale(0.94) translateY(10px); } to { opacity:1; transform:scale(1) translateY(0); } }

        .fade-up { animation: fadeUp 0.4s cubic-bezier(0.16,1,0.3,1) forwards; opacity: 0; }
        .fade-in { animation: fadeIn 0.3s ease forwards; }
        .slide-in { animation: slideIn 0.3s ease forwards; }
        .modal-in { animation: modalIn 0.3s cubic-bezier(0.16,1,0.3,1); }
        .spin { animation: spin 1s linear infinite; }
        .pulse-dot { animation: ping 1.5s ease-in-out infinite; }

        /* Stagger children */
        .stagger > *:nth-child(1) { animation-delay: 0ms; }
        .stagger > *:nth-child(2) { animation-delay: 60ms; }
        .stagger > *:nth-child(3) { animation-delay: 120ms; }
        .stagger > *:nth-child(4) { animation-delay: 180ms; }
        .stagger > *:nth-child(5) { animation-delay: 240ms; }
        .stagger > *:nth-child(6) { animation-delay: 300ms; }

        /* Cards */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
        }
        .card:hover { border-color: #a9b7c7; box-shadow: 0 4px 14px rgba(28,34,48,0.08); }
        .card-static { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 1px 2px rgba(15,39,63,0.03); }

        /* Inputs */
        .inp {
            width: 100%; padding: 10px 14px;
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: 6px; color: var(--text);
            font-family: 'Sarabun', sans-serif; font-size: 14px;
            outline: none; transition: all 0.2s;
        }
        .inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(30,58,95,0.10); }
        .inp:disabled { opacity: 0.4; cursor: not-allowed; }
        .inp::placeholder { color: var(--text3); }

        /* Buttons */
        .btn { padding: 9px 18px; border-radius: 6px; font-weight: 600; font-size: 14px; transition: all 0.2s; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #16324f; }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text2); }
        .btn-ghost:hover { background: var(--surface2); color: var(--text); border-color: var(--text3); }
        .btn-danger { background: rgba(164,38,44,0.1); color: var(--red); border: 1px solid rgba(164,38,44,0.2); }
        .btn-danger:hover { background: rgba(164,38,44,0.2); }
        .btn-success { background: rgba(20,108,67,0.1); color: var(--green); border: 1px solid rgba(20,108,67,0.2); }

        /* Nav */
        .nav-item { 
            display: flex; align-items: center; gap: 12px; 
            padding: 10px 14px; border-radius: 6px; 
            color: var(--text2); font-weight: 500; font-size: 14px;
            transition: all 0.2s; cursor: pointer; position: relative;
        }
        .nav-item:hover { background: var(--surface2); color: var(--text); }
        .nav-item.active { background: rgba(30,58,95,0.12); color: var(--accent); }
        .nav-item.active::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; background: var(--accent); border-radius: 0 3px 3px 0; }

        /* Status badges */
        .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.2px; }
        .badge-green { background: rgba(20,108,67,0.12); color: var(--green); border: 1px solid rgba(20,108,67,0.2); }
        .badge-red { background: rgba(164,38,44,0.12); color: var(--red); border: 1px solid rgba(164,38,44,0.2); }
        .badge-orange { background: rgba(181,101,29,0.12); color: var(--orange); border: 1px solid rgba(181,101,29,0.2); }
        .badge-blue { background: rgba(30,58,95,0.12); color: var(--accent); border: 1px solid rgba(30,58,95,0.2); }
        .badge-yellow { background: rgba(138,109,26,0.12); color: var(--yellow); border: 1px solid rgba(138,109,26,0.2); }
        .badge-gray { background: rgba(90,98,115,0.12); color: var(--text2); border: 1px solid var(--border); }

        /* Mobile nav */
        .mobile-nav-btn { 
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            font-size: 10px; color: var(--text3); padding: 8px 12px; min-width: 56px;
            transition: all 0.2s; cursor: pointer; border-radius: 6px;
        }
        .mobile-nav-btn.active { color: var(--accent); background: rgba(30,58,95,0.08); }

        /* Application shell */
        .desktop-sidebar { width:260px; background:var(--surface); border-right:1px solid var(--border); height:100%; display:flex; flex-direction:column; padding:20px 16px; flex-shrink:0; }
        .mobile-bottom-nav { display:none; }
        .app-topbar { height:64px; flex-shrink:0; background:rgba(255,255,255,.96); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 24px; }
        .app-topbar-title { font-size:17px; font-weight:800; color:var(--accent2); }
        .app-topbar-subtitle { font-size:11px; color:var(--text3); margin-top:2px; }
        .system-status { display:flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--green); background:rgba(20,108,67,.08); border:1px solid rgba(20,108,67,.18); padding:6px 10px; border-radius:6px; }
        .system-status-dot { width:7px; height:7px; border-radius:50%; background:var(--green); }
        .brand-logo-shell { width:62px; height:50px; background:#fff; border:1px solid var(--border); border-radius:8px; padding:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden; }
        .brand-logo { width:100%; height:100%; object-fit:contain; display:block; }
        .topbar-brand-logo { display:none; width:38px; height:34px; object-fit:contain; border-radius:5px; background:#fff; }
        .view-content { flex:1; overflow:hidden; position:relative; }
        .detail-layout { display:flex; gap:16px; flex-wrap:wrap; }
        .asset-side { width:clamp(320px,32vw,420px); max-width:420px; flex-shrink:0; display:flex; flex-direction:column; gap:12px; }
        .detail-main { flex:1; min-width:280px; }
        .detail-tabs { display:flex; border-bottom:1px solid var(--border); overflow-x:auto; scrollbar-width:none; }
        .detail-tabs::-webkit-scrollbar { display:none; }
        .asset-image-shell { min-height:260px; max-height:65vh; background:#e9edf2; cursor:zoom-in; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; border-bottom:1px solid var(--border); }
        .asset-image { display:block; width:100%; height:auto; max-height:65vh; object-fit:contain; }
        .field-row { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; padding:10px 0; border-bottom:1px solid var(--border); }
        .field-value { font-weight:600; font-size:13px; max-width:65%; text-align:right; overflow-wrap:anywhere; white-space:normal; }

        /* Glow effects */
        .glow-blue { box-shadow: 0 0 20px rgba(30,58,95,0.3); }
        .glow-green { box-shadow: 0 0 20px rgba(20,108,67,0.3); }
        .glow-red { box-shadow: 0 0 20px rgba(164,38,44,0.2); }

        /* Grid pattern bg */
        .grid-bg {
            background-image: 
                linear-gradient(rgba(30,58,95,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30,58,95,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Kanban */
        .kanban-col { min-width: 300px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
        .kanban-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 14px; transition: all 0.2s; cursor: pointer; }
        .kanban-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(28,34,48,0.08); }

        /* Chart bars */
        .bar-fill { transition: height 0.8s cubic-bezier(0.16,1,0.3,1); }

        /* Toast */
        .toast { 
            position: fixed; bottom: 90px; right: 20px; z-index: 9999;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; padding: 14px 18px;
            box-shadow: 0 8px 28px rgba(28,34,48,0.14);
            display: flex; align-items: center; gap: 12px; min-width: 280px;
            animation: modalIn 0.3s cubic-bezier(0.16,1,0.3,1);
        }

        /* Overdue pulse */
        .overdue-pulse { position: relative; }
        .overdue-pulse::after { content: ''; position: absolute; top: 0; right: 0; width: 8px; height: 8px; background: var(--red); border-radius: 50%; animation: ping 1.5s ease-in-out infinite; }

        .scroll-y { overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .pb-nav { padding-bottom: 24px; }

        /* Safe area */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .pb-nav { padding-bottom: 24px; }
        }

        /* QR */
        #qr-container canvas, #qr-container img { border-radius: 8px; }

        /* Shimmer loading */
        .shimmer {
            background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
            background-size: 1000px 100%;
            animation: shimmer 2s infinite;
            border-radius: 8px;
        }

        /* View mode toggle */
        .viewmode-btn {
            display:flex; align-items:center; justify-content:center;
            width:36px; height:36px; border-radius:8px;
            color: var(--text3); border:1px solid var(--border); background:transparent;
            cursor:pointer; transition: all 0.2s;
        }
        .viewmode-btn:hover { background: var(--surface2); color: var(--text); }
        .viewmode-btn.active { background: rgba(30,58,95,0.14); color: var(--accent); border-color: var(--accent); }

        /* Asset list row (list view) */
        .asset-row { display:flex; align-items:center; gap:14px; padding:10px 14px; cursor:pointer; }
        .asset-row:hover { border-color: var(--accent); }
        .asset-grid-large, .asset-grid-compact { display:grid; overflow-y:auto; flex:1; min-height:0; padding-bottom:16px; align-content:start; grid-auto-rows:max-content; }
        .asset-grid-large { grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
        .asset-grid-compact { grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
        .asset-card-large, .asset-card-compact { height:auto !important; align-self:start; flex:none !important; }
        .asset-card-large { min-height:260px !important; }
        .asset-card-compact { min-height:220px !important; }
        .asset-photo-large { width:100%; aspect-ratio:4/3; min-height:170px; background:var(--surface2); position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
        .asset-photo-compact { width:100%; height:140px; min-height:140px; background:var(--surface2); border-radius:6px; position:relative; overflow:hidden; flex:none; display:flex; align-items:center; justify-content:center; }
        .asset-list-photo { width:100%; height:100%; object-fit:contain; display:block; background:#e9edf2; }

        @media (max-width: 767px) {
            body { height:100dvh; }
            .desktop-sidebar { display:none; }
            .mobile-bottom-nav { position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,.98); border-top:1px solid var(--border); display:flex; justify-content:space-around; align-items:center; padding:5px 4px calc(5px + env(safe-area-inset-bottom)); z-index:50; box-shadow:0 -4px 18px rgba(14,39,63,.08); }
            .mobile-nav-btn { flex:1; min-width:0; min-height:52px; padding:6px 2px; border-radius:7px; font-weight:600; }
            .mobile-nav-btn.active { background:rgba(22,58,95,.09); }
            .app-topbar { height:58px; padding:0 14px; }
            .topbar-brand-logo { display:block; }
            .app-topbar-title { font-size:15px; }
            .app-topbar-subtitle { display:none; }
            .system-status { font-size:10px; padding:5px 8px; }
            .view-content > div { padding-left:12px !important; padding-right:12px !important; }
            .detail-layout { display:block; }
            .asset-side { width:100%; max-width:none; margin-bottom:12px; }
            .detail-main { min-width:0; width:100%; }
            .asset-image-shell { min-height:220px; max-height:none; }
            .asset-image { max-height:none; }
            .field-row { gap:8px; }
            .field-value { max-width:68%; }
            .detail-tabs > button { flex:0 0 auto !important; min-width:120px; min-height:48px; padding:11px 13px !important; }
            .card, .card-static { border-radius:7px; }
            .btn { min-height:42px; padding:9px 14px; }
            .inp { min-height:44px; font-size:16px; background:#fff; }
            textarea.inp { min-height:88px; }
            .toast { left:12px; right:12px; bottom:76px; min-width:0; padding:12px 14px; }
            .kanban-col { min-width:86vw; }
            .asset-row { padding:12px; gap:10px; }
            .asset-grid-large { grid-template-columns:1fr; gap:12px; }
            .asset-grid-compact { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
            .asset-photo-large { min-height:220px; }
            .asset-photo-compact { height:125px; min-height:125px; }
            .asset-card-compact { min-height:205px !important; }
            .spare-form-layout { grid-template-columns:1fr !important; }
            .pm-builder-row { grid-template-columns:1fr !important; }
            .pm-result-footer { grid-template-columns:1fr !important; }
            .pb-nav { padding-bottom:82px !important; }
        }

        @media (min-width: 768px) and (max-width: 1100px) {
            .desktop-sidebar { width:220px; }
            .app-topbar { padding:0 18px; }
        }
    </style>
</head>
<body>
<div id="root" style="width:100%;height:100vh;"></div>

<script type="text/babel" src="./pm-documents.js"></script>

// ====== UTILS ======
const fileToBase64 = (file) => new Promise((res, rej) => {
    if (file.size > 5 * 1024 * 1024) { alert("ไฟล์ต้องไม่เกิน 5MB"); return; }
    const r = new FileReader();
    r.readAsDataURL(file);
    r.onload = () => res(r.result);
    r.onerror = rej;
});

const daysDiff = (dateStr) => {
    if (!dateStr) return null;
    const today = new Date(); today.setHours(0,0,0,0);
    const d = new Date(dateStr); d.setHours(0,0,0,0);
    return Math.ceil((d - today) / 86400000);
};

const getPmCategory = (dateStr) => {
    const d = daysDiff(dateStr);
    if (d === null) return 'none';
    if (d < 0) return 'overdue';
    if (d <= 7) return 'thisWeek';
    if (d <= 14) return 'nextWeek';
    if (d <= 30) return 'thisMonth';
    return 'future';
};

const fmtNum = (n) => Number(n || 0).toLocaleString('th-TH');
const fmtDate = (str) => str ? new Date(str).toLocaleDateString('th-TH', {day:'numeric',month:'short',year:'2-digit'}) : '-';

// ====== SHARED PRESENTATIONAL COMPONENTS (top-level!) ======
// NOTE: These must live OUTSIDE any component function. If declared inside
// a parent component's body, React treats them as a brand-new component
// type on every re-render (since the function reference changes), which
// forces React to unmount + remount the whole subtree -- including any
// <input> inside it. That's what caused the "type one character, lose
// focus" bug in the add/edit asset form.

);

const Toast = ({ notify, setNotify }) => {
    if (!notify.show) return null;
    return (

const GlobalSearch = ({ data, setView, setSelectedAsset }) => {
    const [q, setQ] = useState('');
    const inputRef = useRef();
    useEffect(() => { inputRef.current?.focus(); }, []);

    const results = useMemo(() => {
        if (!q.trim() || q.length < 2) return [];
        const s = q.toLowerCase();
        return data.assets.filter(a => {
            return (
                String(a.name||'').toLowerCase().includes(s) ||
                String(a.id||'').toLowerCase().includes(s) ||
                String(a.model||'').toLowerCase().includes(s) ||
                String(a.location||'').toLowerCase().includes(s) ||
                String(a.vendor||'').toLowerCase().includes(s) ||
                String(a.electrical?.breaker||'').toLowerCase().includes(s) ||
                String(a.water?.pump||'').toLowerCase().includes(s)
            );
        }).slice(0, 30);
    }, [q, data.assets]);

    const highlight = (text, query) => {
        if (!query || !text) return text;
        const idx = String(text).toLowerCase().indexOf(query.toLowerCase());
        if (idx === -1) return text;
        return <>{String(text).slice(0,idx)}<mark style={{background:'rgba(30,58,95,0.3)',color:'var(--accent)',borderRadius:3,padding:'0 2px'}}>{String(text).slice(idx,idx+query.length)}</mark>{String(text).slice(idx+query.length)}</>;
    };

    return (
        <div style={{padding:'24px',maxWidth:900,margin:'0 auto',height:'100%',display:'flex',flexDirection:'column'}} className="fade-up pb-nav scroll-y">
            <div style={{marginBottom:24}}>
                <h2 style={{fontSize:24,fontWeight:800,marginBottom:4}}>ค้นหาทั่วระบบ</h2>
                <p style={{color:'var(--text2)',fontSize:14}}>ค้นหาข้ามแผนก — ชื่อ, รหัส, รุ่น, Breaker, Pump, ผู้จำหน่าย</p>
            </div>
            <div style={{position:'relative',marginBottom:24}}>
                <I d={ic.search} size={20} cls="" style={{position:'absolute',left:16,top:'50%',transform:'translateY(-50%)',color:'var(--text3)'}}/>
                <input ref={inputRef} className="inp" value={q} onChange={e=>setQ(e.target.value)} placeholder="พิมพ์ชื่อ รหัส รุ่น เบรคเกอร์ ปั๊มน้ำ..." style={{paddingLeft:48,fontSize:16,padding:'14px 16px 14px 48px'}} />
                {q && <button onClick={()=>setQ('')} style={{position:'absolute',right:14,top:'50%',transform:'translateY(-50%)',color:'var(--text3)'}}><I d={ic.x} size={18}/></button>}
            </div>

            {q.length >= 2 && (
                <div style={{color:'var(--text3)',fontSize:12,marginBottom:12}}>
                    พบ {results.length} รายการ{results.length===30?' (แสดง 30 รายการแรก)':''}
                </div>
            )}

            <div style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column',gap:8}}>
                {results.map(item => (
                    <div key={item.id} className="card" style={{padding:16,display:'flex',gap:14,alignItems:'center',cursor:'pointer'}} onClick={()=>{setSelectedAsset(item);setView('detail');}}>
                        <div style={{width:56,height:56,background:'var(--surface2)',borderRadius:6,overflow:'hidden',flexShrink:0}}>
                            {item.image ? <img src={item.image} style={{width:'100%',height:'100%',objectFit:'cover'}}/> : <div style={{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text3)'}}><I d={ic.img} size={20}/></div>}
                        </div>
                        <div style={{flex:1,minWidth:0}}>
                            <div style={{fontWeight:700,marginBottom:2}}>{highlight(item.name, q)}</div>
                            <div style={{fontSize:12,fontFamily:'IBM Plex Mono,monospace',color:'var(--accent)',marginBottom:6}}>{highlight(item.id, q)}</div>
                            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                                <span className="badge badge-gray">{item.location}</span>
                                {item.model && <span className="badge badge-gray">{highlight(item.model, q)}</span>}
                                {item.electrical?.breaker && <span className="badge badge-yellow">⚡ {highlight(item.electrical.breaker, q)}</span>}
                                {item.water?.pump && <span className="badge badge-blue">💧 {highlight(item.water.pump, q)}</span>}
                                <span className={`badge ${item.status==='ปกติ'?'badge-green':'badge-orange'}`}>{item.status}</span>
                            </div>
                        </div>
                        <I d={ic.back} size={18} cls="" style={{color:'var(--text3)',transform:'rotate(180deg)',flexShrink:0}}/>
                    </div>
                ))}
                {q.length >= 2 && results.length === 0 && (
                    <div style={{textAlign:'center',padding:60,color:'var(--text3)'}}>
                        <I d={ic.search} size={48} cls="" style={{opacity:0.2,marginBottom:12}}/>
                        <div>ไม่พบ "{q}" ในระบบ</div>
                    </div>
                )}
                {q.length < 2 && (
                    <div style={{textAlign:'center',padding:60,color:'var(--text3)'}}>
                        <I d={ic.search} size={48} cls="" style={{opacity:0.15,marginBottom:12}}/>
                        <div>พิมพ์อย่างน้อย 2 ตัวอักษร</div>
                    </div>
                )}
            </div>
        </div>
    );
};

const KanbanBoard = ({ assets, setSelectedAsset, setView }) => {
    const [allPm, setAllPm] = useState([]);
    const [loading, setLoading] = useState(false);
    const [filter, setFilter] = useState('all');

    useEffect(() => {
        const load = async () => {
            setLoading(true);
            try {
                const r = await fetch(API_URL, { method:'POST', body: JSON.stringify({action:'get_all_pm_dashboard'}) });
                const j = await r.json();
                if (j.allPm) setAllPm(j.allPm);
            } catch(e) { console.error(e); }
            setLoading(false);
        };
        load();
    }, []);

    const filtered = filter === 'all' ? allPm : allPm.filter(t => t.status === filter);

    const cols = [
        { id:'overdue', label:'🔴 เกินกำหนด', color:'var(--red)', bgColor:'rgba(164,38,44,0.06)', borderColor:'rgba(164,38,44,0.2)' },
        { id:'thisWeek', label:'🟠 สัปดาห์นี้', color:'var(--orange)', bgColor:'rgba(181,101,29,0.06)', borderColor:'rgba(181,101,29,0.2)' },
        { id:'nextWeek', label:'🔵 สัปดาห์หน้า', color:'var(--accent)', bgColor:'rgba(30,58,95,0.06)', borderColor:'rgba(30,58,95,0.2)' },
        { id:'thisMonth', label:'🟢 เดือนนี้', color:'var(--green)', bgColor:'rgba(20,108,67,0.06)', borderColor:'rgba(20,108,67,0.2)' },
        { id:'future', label:'⚪ อนาคต', color:'var(--text2)', bgColor:'rgba(90,98,115,0.06)', borderColor:'var(--border)' },
    ];

    const getItems = (colId) => filtered.filter(t => getPmCategory(t.planDate) === colId);

    const handleClick = (t) => {
        const a = assets.find(x => String(x.id) === String(t.assetId));
        if (a) { setSelectedAsset(a); setView('detail'); }
    };

    const statuses = ['all','รอเป้าหมาย','ดำเนินการแล้ว','ยกเลิก'];

    return (

            <div style={{display:'flex',flexWrap:'wrap',gap:12,alignItems:'center',marginBottom:20,flexShrink:0}}>
                <div>
                    <h2 style={{fontSize:22,fontWeight:800}}>PM Kanban Board</h2>
                    <p style={{fontSize:13,color:'var(--text2)'}}>ภาพรวมตารางงาน PM ทั้งหมด</p>
                </div>
                <div style={{marginLeft:'auto',display:'flex',gap:6,flexWrap:'wrap'}}>
                    {statuses.map(s => (
                        <button key={s} className={`btn ${filter===s?'btn-primary':'btn-ghost'}`} style={{padding:'6px 14px',fontSize:12}} onClick={()=>setFilter(s)}>
                            {s==='all'?'ทั้งหมด':s}
                        </button>
                    ))}
                </div>
            </div>
            {loading ? (
                <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text3)',gap:12}}>
                    <Loader size={24}/> กำลังโหลด...
                </div>
            ) : (
                <div style={{display:'flex',gap:16,overflowX:'auto',flex:1,paddingBottom:16,alignItems:'flex-start'}} className="scroll-y">
                    {cols.map(col => {
                        const items = getItems(col.id);
                        return (
                            <div key={col.id} className="kanban-col" style={{flexShrink:0,background:col.bgColor,borderColor:col.borderColor,display:'flex',flexDirection:'column',maxHeight:'100%'}}>
                                <div style={{padding:'14px 16px',borderBottom:`1px solid ${col.borderColor}`,display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
                                    <span style={{fontWeight:700,fontSize:13,color:col.color}}>{col.label}</span>
                                    <span style={{background:col.color+'22',color:col.color,fontSize:11,fontWeight:700,padding:'2px 8px',borderRadius:6}}>{items.length}</span>
                                </div>

                                                <div style={{fontWeight:700,fontSize:13,lineHeight:1.3}}>{t.assetName}</div>

                                            <div style={{fontSize:12,color:'var(--text2)',marginBottom:8}}>{t.topic}</div>

                        );

        </div>
    );

const QrModal = ({ asset, onClose }) => {
    const qrRef = useRef();
    const [qrGenerated, setQrGenerated] = useState(false);
    const url = `${window.location.href.split('?')[0]}?asset=${asset.id}`;

    useEffect(() => {
        if (qrRef.current && !qrGenerated) {
            qrRef.current.innerHTML = '';
            try {
                new QRCode(qrRef.current, {
                    text: url,
                    width: 200, height: 200,
                    colorDark: '#1a1d27', colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.H
                });
                setQrGenerated(true);
            } catch(e) {
                qrRef.current.innerHTML = `<div style="font-size:11px;color:var(--text3);text-align:center;padding:20px">QR: ${asset.id}</div>`;
            }
        }
    }, []);

    const handlePrint = () => {
        const w = window.open('', '_blank');
        const qrHtml = qrRef.current?.innerHTML || '';
        w.document.write(`
            <html><head><title>QR - ${asset.name}</title>
            <style>body{font-family:sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px;background:#fff;} .box{border:2px solid #000;padding:16px;border-radius:8px;text-align:center;} h2{font-size:14px;margin:8px 0 4px;} p{font-size:11px;color:#666;margin:0;font-family:monospace;}</style>
            </head><body><div class="box">${qrHtml}<h2>${asset.name}</h2><p>${asset.id}</p><p>${asset.location}</p></div><script>window.print();setTimeout(()=>window.close(),1000);<\/script></body></html>
        `);
        w.document.close();
    };

    return (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',zIndex:100,display:'flex',alignItems:'center',justifyContent:'center',padding:20,backdropFilter:'blur(4px)'}} onClick={onClose}>
            <div className="card-static modal-in" style={{padding:28,maxWidth:340,width:'100%',textAlign:'center'}} onClick={e=>e.stopPropagation()}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
                    <h3 style={{fontWeight:800,fontSize:16,display:'flex',alignItems:'center',gap:8}}><I d={ic.qr} size={18}/> QR Code</h3>
                    <button onClick={onClose} style={{color:'var(--text3)'}}><I d={ic.x} size={20}/></button>
                </div>
                <div style={{background:'white',padding:16,borderRadius:8,display:'inline-block',marginBottom:16}}>
                    <div ref={qrRef}/>
                </div>
                <div style={{fontWeight:700,marginBottom:4}}>{asset.name}</div>
                <div style={{fontSize:12,fontFamily:'IBM Plex Mono,monospace',color:'var(--accent)',marginBottom:16}}>{asset.id}</div>
                <div style={{fontSize:11,color:'var(--text3)',marginBottom:16,wordBreak:'break-all',padding:'8px',background:'var(--surface2)',borderRadius:8}}>{url}</div>
                <button className="btn btn-primary" style={{width:'100%',justifyContent:'center'}} onClick={handlePrint}>
                    🖨️ พิมพ์สติ๊กเกอร์
                </button>
            </div>
        </div>
    );
};

// ====== EXECUTIVE DASHBOARD ======
const ExecutiveDashboard = ({ data }) => {
    const assets = data.assets;
    const total = assets.length;
    const repairing = assets.filter(a => a.status === 'ส่งซ่อม').length;
    const noPm = assets.filter(a => !a.nextPmDate).length;

    const deptCost = {};
    assets.forEach(a => {
        const cost = (a.history||[]).reduce((s,h) => s + Number(h.totalCost||0), 0);
        if (!deptCost[a.location]) deptCost[a.location] = 0;
        deptCost[a.location] += cost;
    });
    const deptCostArr = Object.entries(deptCost).sort((a,b) => b[1]-a[1]).slice(0,6);
    const maxCost = Math.max(...deptCostArr.map(d=>d[1]), 1);

    const repairCount = assets.map(a => ({
        name: a.name, id: a.id,
        count: (a.history||[]).length,
        cost: (a.history||[]).reduce((s,h) => s + Number(h.totalCost||0), 0)
    })).sort((a,b) => b.count - a.count).slice(0,5);

    const totalCost = assets.reduce((s,a) => s + (a.history||[]).reduce((ss,h) => ss + Number(h.totalCost||0), 0), 0);
    const pmCompliance = total > 0 ? Math.round(((total - noPm) / total) * 100) : 0;

    const StatCard = ({label, value, sub, color='var(--accent)', icon}) => (
        <div className="card-static fade-up" style={{padding:20}}>
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:12}}>
                <div style={{background:color+'18',color,padding:10,borderRadius:6}}>{icon}</div>
                <div style={{color:'var(--text3)',fontSize:12,fontWeight:600}}>{label}</div>
            </div>
            <div style={{fontSize:28,fontWeight:800,color}}>{value}</div>
            {sub && <div style={{fontSize:12,color:'var(--text3)',marginTop:4}}>{sub}</div>}
        </div>
    );

    return (
        <div style={{padding:24,maxWidth:1200,margin:'0 auto',height:'100%',overflowY:'auto'}} className="fade-up pb-nav">
            <div style={{marginBottom:24}}>
                <h2 style={{fontSize:22,fontWeight:800,marginBottom:4}}>รายงานผู้บริหาร</h2>
                <p style={{fontSize:13,color:'var(--text2)'}}>ภาพรวมค่าใช้จ่ายและสถานะอุปกรณ์ทั้งหมด</p>
            </div>

            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:16,marginBottom:24}} className="stagger">
                <StatCard label="อุปกรณ์ทั้งหมด" value={total} icon={<I d={ic.building} size={20}/>} color="var(--accent)"/>
                <StatCard label="กำลังซ่อม" value={repairing} icon={<I d={ic.wrench} size={20}/>} color="var(--orange)" sub={`${Math.round(repairing/total*100)||0}% ของทั้งหมด`}/>
                <StatCard label="PM Compliance" value={`${pmCompliance}%`} icon={<I d={ic.cal} size={20}/>} color={pmCompliance>80?'var(--green)':'var(--orange)'} sub={`${noPm} เครื่องไม่มีแผน PM`}/>
                <StatCard label="ค่าซ่อมรวม" value={`฿${fmtNum(totalCost)}`} icon={<I d={ic.chart} size={20}/>} color="var(--yellow)" sub="ตลอดอายุการใช้งาน"/>
            </div>

            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:24}} className="stagger">
                <div className="card-static" style={{padding:20}}>
                    <h3 style={{fontWeight:700,marginBottom:16,display:'flex',alignItems:'center',gap:8}}><I d={ic.chart} size={16}/> ค่าซ่อมตามแผนก</h3>
                    {deptCostArr.length === 0 && <div style={{color:'var(--text3)',fontSize:13,textAlign:'center',padding:20}}>ยังไม่มีข้อมูลค่าซ่อม</div>}
                    <div style={{display:'flex',flexDirection:'column',gap:10}}>
                        {deptCostArr.map(([dept, cost]) => (
                            <div key={dept}>
                                <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:4}}>
                                    <span style={{color:'var(--text2)'}}>{dept}</span>
                                    <span style={{fontWeight:700,fontFamily:'IBM Plex Mono,monospace'}}>฿{fmtNum(cost)}</span>
                                </div>
                                <div style={{height:6,background:'var(--surface2)',borderRadius:4,overflow:'hidden'}}>
                                    <div style={{height:'100%',background:'linear-gradient(90deg,var(--accent),var(--accent2))',width:`${(cost/maxCost)*100}%`,borderRadius:4,transition:'width 1s cubic-bezier(0.16,1,0.3,1)'}}/>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>

                <div className="card-static" style={{padding:20}}>
                    <h3 style={{fontWeight:700,marginBottom:16,display:'flex',alignItems:'center',gap:8}}><I d={ic.trend} size={16}/> ซ่อมบ่อยที่สุด</h3>
                    {repairCount.filter(r=>r.count>0).length === 0 && <div style={{color:'var(--text3)',fontSize:13,textAlign:'center',padding:20}}>ยังไม่มีประวัติซ่อม</div>}
                    <div style={{display:'flex',flexDirection:'column',gap:8}}>
                        {repairCount.filter(r=>r.count>0).map((r,i) => (
                            <div key={r.id} style={{display:'flex',gap:12,alignItems:'center',padding:'8px 10px',background:'var(--surface2)',borderRadius:6}}>
                                <div style={{fontWeight:800,fontSize:18,color:'var(--text3)',width:24,textAlign:'center'}}>{i+1}</div>
                                <div style={{flex:1,minWidth:0}}>
                                    <div style={{fontWeight:600,fontSize:13,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.name}</div>
                                    <div style={{fontSize:11,color:'var(--text3)',fontFamily:'IBM Plex Mono,monospace'}}>{r.id}</div>
                                </div>
                                <div style={{textAlign:'right'}}>
                                    <div style={{fontWeight:700,color:'var(--orange)'}}>{r.count} ครั้ง</div>
                                    <div style={{fontSize:11,color:'var(--text3)'}}>฿{fmtNum(r.cost)}</div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </div>

            <div className="card-static" style={{padding:20,textAlign:'center'}}>
                <h3 style={{fontWeight:700,marginBottom:16}}>สรุปสถานะ PM ทั้งระบบ</h3>
                <div style={{display:'flex',justifyContent:'center',gap:32,flexWrap:'wrap'}}>
                    {[
                        {label:'มีแผน PM', value:total-noPm, color:'var(--green)'},
                        {label:'ไม่มีแผน PM', value:noPm, color:'var(--red)'},
                        {label:'กำลังซ่อม', value:repairing, color:'var(--orange)'},
                        {label:'ปกติ', value:total-repairing, color:'var(--accent)'},
                    ].map(s => (
                        <div key={s.label} style={{textAlign:'center'}}>
                            <div style={{fontSize:36,fontWeight:800,color:s.color}}>{s.value}</div>
                            <div style={{fontSize:12,color:'var(--text2)',marginTop:4}}>{s.label}</div>
                        </div>
                    ))}
                </div>
            </div>
        </div>
    );
};

        <div style={{display:'flex',gap:4,background:'var(--surface2)',padding:4,borderRadius:6,border:'1px solid var(--border)'}}>

                <button key={m.id} className={`viewmode-btn ${viewMode===m.id?'active':''}`} title={m.title} onClick={()=>setViewMode(m.id)}>

const AddAssetView = ({ data, selectedDept, setView, postData, view, editItem }) => {

        id:editItem.id, name:editItem.name, model:editItem.model||'', location:editItem.location,
        status:editItem.status, purchaseDate:editItem.purchaseDate||new Date().toISOString().split('T')[0],
        vendor:editItem.vendor||'', image:editItem.image||'', receiptPdf:editItem.receiptPdf||''
    } : {id:'รอสร้างอัตโนมัติ...',name:'',model:'',location:selectedDept||'',status:'ปกติ',purchaseDate:new Date().toISOString().split('T')[0],vendor:'',image:'',receiptPdf:''});
    const [elec, setElec] = useState(isEdit&&editItem?.electrical?editItem.electrical:{uses:false,watt:'',amp:'',hp:'',breaker:''});
    const [water, setWater] = useState(isEdit&&editItem?.water?editItem.water:{uses:false,type:'Tap water',pump:''});

    const handleFile = async (e,k) => { if(e.target.files[0]) setForm({...form,[k]:await fileToBase64(e.target.files[0])}); };

    useEffect(() => {
        if(!isEdit && form.location && form.id==='รอสร้างอัตโนมัติ...') {
            const d = data.departments.find(d=>d.name===form.location);
            if(d){
                const prefix = `MTA-${d.code}-${new Date().getFullYear()}-`;
                const existing = data.assets.filter(a=>a.id&&a.id.startsWith(prefix)).map(a=>parseInt(a.id.split('-').pop()));

                            {form.image ? <img src={form.image} style={{width:'100%',height:'100%',objectFit:'cover',position:'absolute',inset:0}}/> : <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8,color:'var(--text3)'}}><I d={ic.img} size={28}/><span style={{fontSize:11}}>เพิ่มรูป</span></div>}
                            <input type="file" accept="image/*" style={{position:'absolute',inset:0,opacity:0,cursor:'pointer'}} onChange={e=>handleFile(e,'image')}/>
                        </div>
                    </div>
                    <div style={{flex:1,minWidth:200,display:'flex',flexDirection:'column',gap:12}}>
                        <div><label style={{fontSize:11,color:'var(--text2)',fontWeight:600,display:'block',marginBottom:6}}>ชื่ออุปกรณ์ *</label><input className="inp" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/></div>
                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                            <div><label style={{fontSize:11,color:'var(--text2)',fontWeight:600,display:'block',marginBottom:6}}>รหัส</label><input className="inp" value={form.id} disabled style={{fontFamily:'IBM Plex Mono,monospace',fontSize:12}}/></div>
                            <div><label style={{fontSize:11,color:'var(--text2)',fontWeight:600,display:'block',marginBottom:6}}>รุ่น</label><input className="inp" value={form.model} onChange={e=>setForm({...form,model:e.target.value})}/></div>
                        </div>
                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                            <div><label style={{fontSize:11,color:'var(--text2)',fontWeight:600,display:'block',marginBottom:6}}>แผนก</label>
                                <select className="inp" value={form.location} disabled={isEdit} onChange={e=>setForm({...form,location:e.target.value})}>
                                    <option value="">-- เลือก --</option>
                                    {data.departments.map(d=><option key={d.name} value={d.name}>{d.name}</option>)}
                                </select>
                            </div>
                            <div><label style={{fontSize:11,color:'var(--text2)',fontWeight:600,display:'block',marginBottom:6}}>สถานะ</label>
                                <select className="inp" value={form.status} onChange={e=>setForm({...form,status:e.target.value})}>
                                    <option>ปกติ</option><option>ส่งซ่อม</option><option>เสีย</option>
                                </select>
                            </div>
                        </div>
                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                            <div><label style={{fontSize:11,color:'var(--text2)',fontWeight:600,display:'block',marginBottom:6}}>วันที่ซื้อ</label><input type="date" className="inp" value={form.purchaseDate} onChange={e=>setForm({...form,purchaseDate:e.target.value})}/></div>
                            <div><label style={{fontSize:11,color:'var(--text2)',fontWeight:600,display:'block',marginBottom:6}}>ผู้จำหน่าย</label><input className="inp" value={form.vendor} onChange={e=>setForm({...form,vendor:e.target.value})}/></div>
                        </div>
                    </div>
                </div>
            </Section>

            <Section title="⚡ ระบบไฟฟ้า">
                <label style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer',marginBottom:elec.uses?16:0}}>
                    <input type="checkbox" checked={elec.uses} onChange={e=>setElec({...elec,uses:e.target.checked})} style={{width:16,height:16,accentColor:'var(--yellow)'}}/>
                    <span style={{fontWeight:600}}>ใช้อุปกรณ์ไฟฟ้า</span>
                </label>
                {elec.uses && <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(130px,1fr))',gap:10}}>
                    {['watt','amp','hp','breaker'].map(k => (
                        <div key={k}><label style={{fontSize:11,color:'var(--text2)',fontWeight:600,display:'block',marginBottom:6,textTransform:'uppercase'}}>{k}</label><input className="inp" value={elec[k]} onChange={e=>setElec({...elec,[k]:e.target.value})} placeholder={k==='breaker'?'B-01':''}/></div>
                    ))}
                </div>}
            </Section>

            <Section title="💧 ระบบน้ำ">
                <label style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer',marginBottom:water.uses?16:0}}>
                    <input type="checkbox" checked={water.uses} onChange={e=>setWater({...water,uses:e.target.checked})} style={{width:16,height:16,accentColor:'var(--accent)'}}/>
                    <span style={{fontWeight:600}}>ใช้ระบบน้ำ</span>
                </label>
                {water.uses && <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                    <div><label style={{fontSize:11,color:'var(--text2)',fontWeight:600,display:'block',marginBottom:6}}>ประเภท</label><select className="inp" value={water.type} onChange={e=>setWater({...water,type:e.target.value})}><option>Tap water</option><option>Di water</option><option>Demin water</option></select></div>
                    <div><label style={{fontSize:11,color:'var(--text2)',fontWeight:600,display:'block',marginBottom:6}}>Pump No.</label><input className="inp" value={water.pump} onChange={e=>setWater({...water,pump:e.target.value})} placeholder="P-05"/></div>
                </div>}
            </Section>

            <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',padding:'14px',fontSize:15}} onClick={()=>postData({action:'save_asset',...form,electrical:elec,water})}>
                💾 บันทึกอุปกรณ์
            </button>
        </div>
    );
};

// ====== DETAIL VIEW ======
const DetailView = ({ item, setView, postData }) => {
    if(!item) return null;
    const [tab, setTab] = useState('history');
    const [log, setLog] = useState({date:new Date().toISOString().split('T')[0],type:'ซ่อมแซม',description:'',labor:'',parts:[]});
    const [part, setPart] = useState({name:'',price:'',image:'',pdf:''});
    const [selLog, setSelLog] = useState(null);
    const [pmList, setPmList] = useState([]);
    const [pmLoading, setPmLoading] = useState(false);
    const [pmForm, setPmForm] = useState({schId:null,topic:'',planDate:'',status:'รอเป้าหมาย',note:'',pmType:'ภายใน',pmVendorName:'',pmVendorContact:'',image:'',pdf:''});
    const [showQr, setShowQr] = useState(false);
    const [imgPop, setImgPop] = useState(null);
    const [fileLoading, setFileLoading] = useState(false);
    const emptySpare = {id:null,name:'',vendor:'',price:'',stock:'',lastPurchaseDate:'',minStock:'',note:'',image:'',removeImage:false};
    const [spareParts, setSpareParts] = useState(() => item.spareParts || []);
    const [spareForm, setSpareForm] = useState(emptySpare);

    useEffect(() => {
        setSpareParts(item.spareParts || []);
        setSpareForm(emptySpare);
    }, [item.id, JSON.stringify(item.spareParts || [])]);

    useEffect(() => { if(tab==='pmschedule') fetchPm(); }, [tab]);

    const fetchPm = async () => {
        setPmLoading(true);
        try {
            const r = await fetch(API_URL,{method:'POST',body:JSON.stringify({action:'get_pm_schedules',assetId:item.id})});
            const j = await r.json();
            if(j.pmSchedules) setPmList(j.pmSchedules);
        } catch(e){}
        setPmLoading(false);
    };

    const savePm = async () => {
        if(!pmForm.topic||!pmForm.planDate) return alert('ระบุหัวข้อและวันที่');
        setPmLoading(true);
        await postData({action:'save_pm_schedule',assetId:item.id,assetName:item.name,schedule:pmForm});
        setPmForm({schId:null,topic:'',planDate:'',status:'รอเป้าหมาย',note:'',pmType:'ภายใน',pmVendorName:'',pmVendorContact:'',image:'',pdf:''});
        setTimeout(fetchPm,2000);
    };

    const delPm = async (id) => { if(!confirm('ลบ?')) return; setPmLoading(true); await postData({action:'delete_pm_schedule',assetId:item.id,schId:id}); setTimeout(fetchPm,2000); };

    const submitLog = () => {
        const total = Number(log.labor)+(log.parts.reduce((s,p)=>s+Number(p.price),0))+(part.name?Number(part.price):0);
        const finalParts = part.name ? [...log.parts,part] : [...log.parts];
        postData({action:'save_log',assetId:item.id,log:{id:log.id||Date.now(),date:log.date,type:log.type,description:log.description,laborCost:log.labor,totalCost:total,parts:finalParts}});
        setLog({date:new Date().toISOString().split('T')[0],type:'ซ่อมแซม',description:'',labor:'',parts:[]});
        setPart({name:'',price:'',image:'',pdf:''});
        setTab('history');
    };

    const handlePmFile = async (e,k) => {
        if(e.target.files[0]){setPmLoading(true);try{const b=await fileToBase64(e.target.files[0]);if(b)setPmForm(p=>({...p,[k]:b}));}catch(e){}finally{setPmLoading(false);}};
    };

    const handlePartFile = async (e,k) => {
        if(e.target.files[0]){setFileLoading(true);try{const b=await fileToBase64(e.target.files[0]);if(b)setPart(p=>({...p,[k]:b}));}catch(e){}finally{setFileLoading(false);}};
    };

    const handleSpareImage = async (e) => {
        if(!e.target.files[0]) return;
        setFileLoading(true);
        try {
            const image = await fileToBase64(e.target.files[0]);
            if(image) setSpareForm(prev => ({...prev,image,removeImage:false}));
        } catch(e) { alert('ไม่สามารถอ่านไฟล์รูปได้'); }
        finally { setFileLoading(false); }
    };

    const saveSparePart = () => {
        if(!spareForm.name.trim()) return alert('กรุณาระบุชื่อ Spare Part');
        if(spareForm.stock === '' || Number(spareForm.stock) < 0) return alert('กรุณาระบุจำนวนสต๊อกให้ถูกต้อง');
        if(spareForm.minStock === '' || Number(spareForm.minStock) < 0) return alert('กรุณาระบุจุดแจ้งเตือนให้ถูกต้อง');
        const saved = {
            ...spareForm,
            id: spareForm.id || Date.now(),
            name: spareForm.name.trim(),
            vendor: spareForm.vendor.trim(),
            price: Number(spareForm.price || 0),
            stock: Number(spareForm.stock),
            minStock: Number(spareForm.minStock),
            updatedAt: new Date().toISOString()
        };
        const next = spareForm.id
            ? spareParts.map(p => String(p.id) === String(spareForm.id) ? saved : p)
            : [...spareParts, saved];
        setSpareParts(next);
        postData({action:'save_spare_part',assetId:item.id,sparePart:saved});
        setSpareForm(emptySpare);
        setTab('spares');
    };

    const deleteSparePart = (id) => {
        if(!confirm('ลบ Spare Part รายการนี้?')) return;
        const next = spareParts.filter(p => String(p.id) !== String(id));
        setSpareParts(next);
        postData({action:'delete_spare_part',assetId:item.id,spareId:id});
        if(String(spareForm.id) === String(id)) setSpareForm(emptySpare);
    };

    const lowStockCount = spareParts.filter(p => Number(p.stock) < Number(p.minStock)).length;

    return (
        <div style={{height:'100%',overflowY:'auto',padding:24}} className="fade-up pb-nav">
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20,flexShrink:0,flexWrap:'wrap'}}>
                <button className="btn btn-ghost" style={{padding:'8px 12px'}} onClick={()=>setView('assets')}><I d={ic.back} size={18}/></button>
                <div style={{flex:1,minWidth:0}}>
                    <h2 style={{fontSize:20,fontWeight:800,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{item.name}</h2>
                    <div style={{display:'flex',gap:8,alignItems:'center',marginTop:4,flexWrap:'wrap'}}>
                        <span style={{fontSize:12,fontFamily:'IBM Plex Mono,monospace',color:'var(--accent)'}}>{item.id}</span>
                        <span className={`badge ${item.status==='ปกติ'?'badge-green':'badge-orange'}`}>{item.status}</span>
                    </div>
                </div>
                <button className="btn btn-ghost" style={{padding:'8px 12px'}} onClick={()=>setShowQr(true)}><I d={ic.qr} size={18}/> QR</button>
            </div>

            <div className="detail-layout">
                <div className="asset-side">
                    <div className="card-static" style={{overflow:'hidden'}}>
                        <div className="asset-image-shell" onClick={()=>item.image&&setImgPop(item.image)} title={item.image ? 'กดเพื่อดูรูปขนาดเต็ม' : ''}>
                            {item.image ? <img src={item.image} className="asset-image" alt={item.name}/> : <div style={{width:'100%',minHeight:220,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text3)'}}><I d={ic.img} size={40}/></div>}
                        </div>
                        <div style={{padding:16}}>
                            <Field label="แผนก" value={item.location}/>
                            <Field label="วันที่ซื้อ" value={fmtDate(item.purchaseDate)}/>
                            <Field label="ผู้จำหน่าย" value={item.vendor}/>
                            {item.receiptPdf && <a href={item.receiptPdf} target="_blank" className="btn btn-ghost" style={{width:'100%',justifyContent:'center',marginTop:10,display:'flex'}}><I d={ic.file} size={16}/> ดูใบเสร็จ</a>}
                        </div>
                        <div style={{padding:'0 16px 16px',display:'flex',gap:8}}>
                            <button className="btn btn-ghost" style={{flex:1,justifyContent:'center',fontSize:12}} onClick={()=>setView('edit_asset')}><I d={ic.wrench} size={14}/> แก้ไข</button>
                            <button className="btn btn-danger" style={{flex:1,justifyContent:'center',fontSize:12}} onClick={()=>{if(confirm('ลบอุปกรณ์นี้?'))postData({action:'delete_asset',id:item.id});}}><I d={ic.trash} size={14}/> ลบ</button>

                            <Field label="Breaker" value={item.electrical.breaker}/>

// ====== UTILITY VIEW ======
const UtilityView = ({ data, type, setView, setSelectedAsset }) => {
    const [q, setQ] = useState('');
    const isElec = type==='electrical';
    const filtered = data.assets.filter(a => {
        if(isElec&&!a.electrical?.uses) return false;
        if(!isElec&&!a.water?.uses) return false;
        const s = q.toLowerCase();
        return !s || String(a.name||'').toLowerCase().includes(s) || String(a.id||'').toLowerCase().includes(s) || (isElec?String(a.electrical?.breaker||''):String(a.water?.pump||'')).toLowerCase().includes(s);
    });
    const grouped = {};
    filtered.forEach(a => {
        const k = isElec?(a.electrical?.breaker||'ไม่ระบุ'):(a.water?.pump||'ไม่ระบุ');
        if(!grouped[k]) grouped[k]=[];
        grouped[k].push(a);
    });
    return (
        <div style={{padding:24,height:'100%',display:'flex',flexDirection:'column'}} className="fade-up pb-nav">
            <div style={{display:'flex',flexWrap:'wrap',gap:12,alignItems:'center',marginBottom:20,flexShrink:0}}>
                <div><h2 style={{fontSize:22,fontWeight:800}}>{isElec?'⚡ ระบบไฟฟ้า':'💧 ระบบน้ำ'}</h2></div>
                <div style={{position:'relative',marginLeft:'auto'}}>
                    <I d={ic.search} size={16} cls="" style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'var(--text3)'}}/>
                    <input className="inp" value={q} onChange={e=>setQ(e.target.value)} placeholder="ค้นหา..." style={{paddingLeft:36,width:220}}/>
                </div>
            </div>
            <div style={{overflowY:'auto',flex:1,display:'flex',flexDirection:'column',gap:14,paddingBottom:16}}>
                {Object.keys(grouped).map(key => (
                    <div key={key} className="card-static" style={{padding:16}}>
                        <div style={{fontWeight:700,fontSize:14,marginBottom:12,color:isElec?'var(--yellow)':'var(--accent)',display:'flex',alignItems:'center',gap:8}}>
                            {isElec?'🔌 Breaker:':'💧 Pump:'} {key}
                            <span className="badge badge-gray">{grouped[key].length}</span>
                        </div>
                        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:8}}>
                            {grouped[key].map(item => (
                                <div key={item.id} className="card" style={{padding:12,display:'flex',gap:10,cursor:'pointer'}} onClick={()=>{setSelectedAsset(item);setView('detail');}}>
                                    <div style={{width:48,height:48,background:'var(--surface2)',borderRadius:8,overflow:'hidden',flexShrink:0}}>
                                        {item.image?<img src={item.image} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:<div style={{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text3)'}}><I d={ic.img} size={16}/></div>}
                                    </div>
                                    <div style={{flex:1,minWidth:0}}>
                                        <div style={{fontWeight:700,fontSize:13,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{item.name}</div>
                                        <div style={{fontSize:11,fontFamily:'IBM Plex Mono,monospace',color:'var(--accent)'}}>{item.id}</div>
                                        <div style={{fontSize:10,color:'var(--text3)',marginTop:4}}>{isElec?`${item.electrical.watt||'-'}W / ${item.electrical.amp||'-'}A`:`${item.water.type||'-'}`}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                ))}
                {Object.keys(grouped).length===0 && <div style={{textAlign:'center',padding:60,color:'var(--text3)'}}>ไม่พบข้อมูล</div>}
            </div>
        </div>
    );
};

// ====== APP ======
const App = () => {
    const [view, setView] = useState('dashboard');
    const [data, setData] = useState({assets:[],departments:[]});
    const [loading, setLoading] = useState(false);
    const [selectedDept, setSelectedDept] = useState(null);
    const [selectedAsset, setSelectedAsset] = useState(null);
    const [notify, setNotify] = useState({show:false,status:'idle',message:'',action:null});

    useEffect(() => { fetchData(); }, []);
    useEffect(() => {
        if(selectedAsset && data.assets.length>0) {
            const updated = data.assets.find(a=>String(a.id)===String(selectedAsset.id));
            if(updated) setSelectedAsset(updated);
        }
    }, [data.assets]);

    useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const assetId = params.get('asset');
        if(assetId && data.assets.length>0) {
            const a = data.assets.find(x=>x.id===assetId);
            if(a){setSelectedAsset(a);setView('detail');}
        }
    }, [data.assets]);

    const fetchData = async () => {
        setLoading(true);
        try {
            const r = await fetch(API_URL);
            const j = await r.json();
            if(j.assets) setData({assets:j.assets,departments:j.departments||[]});
        } catch(e){ console.error(e); }
        setLoading(false);
    };

    const postData = async (payload) => {
        setNotify({show:true,status:'syncing',message:'กำลังบันทึก...',action:null});
        try {
            const response = await fetch(API_URL,{method:'POST',body:JSON.stringify(payload)});
            const result = await response.json();
            if(result.status === 'error') throw new Error(result.message || 'ไม่สามารถบันทึกข้อมูลได้');
            if(['save_asset','delete_asset'].includes(payload.action)) setView('assets');
            setNotify({show:true,status:'success',message:'บันทึกสำเร็จ!',action:()=>{fetchData();setNotify({show:false});}});
        } catch(e) {
            setNotify({show:true,status:'error',message:'ผิดพลาด: '+e.message,action:null});
            setTimeout(()=>setNotify({show:false}),5000);
        }
    };

    const pmOverdue = useMemo(() => {
        return 0;
    }, [data]);

    if(loading && data.assets.length===0) {
        return (
            <div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16,background:'var(--bg)'}}>
                <div style={{width:150,height:100,background:'#fff',border:'1px solid var(--border)',padding:6,borderRadius:10}}><img src={BRAND_LOGO} style={{width:'100%',height:'100%',objectFit:'contain'}} alt="โลโก้แผนกซ่อมบำรุง"/></div>
                <div style={{fontWeight:800,fontSize:20}}>ระบบบริหารงานซ่อมบำรุง</div>
                <div style={{display:'flex',alignItems:'center',gap:8,color:'var(--text3)'}}><Loader/> กำลังโหลด...</div>
            </div>
        );
    }

    return (
        <div style={{display:'flex',height:'100vh',width:'100%',overflow:'hidden',background:'var(--bg)'}}>
            <Toast notify={notify} setNotify={setNotify}/>
            <Sidebar view={view} setView={setView} fetchData={fetchData} pmOverdue={pmOverdue}/>
            <main style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column',position:'relative'}}>
                <AppTopbar view={view} selectedDept={selectedDept} selectedAsset={selectedAsset}/>
                <div className="view-content">
                    {view==='dashboard' && <Dashboard data={data} setView={setView}/>}
                    {view==='kanban' && <KanbanBoard assets={data.assets} setSelectedAsset={setSelectedAsset} setView={setView}/>}
                    {view==='pm_documents' && (window.PMDocumentsView
                        ? <window.PMDocumentsView data={data}/>
                        : <div style={{padding:40,textAlign:'center',color:'var(--red)'}}><h3 style={{fontWeight:800}}>ไม่สามารถโหลดระบบเอกสาร PM</h3><p style={{marginTop:8}}>ไม่พบไฟล์ pm-documents.js กรุณาตรวจสอบชื่อและตำแหน่งไฟล์บน GitHub</p></div>
                    )}
                    {view==='departments' && <DeptView data={data} setSelectedDept={setSelectedDept} setView={setView} postData={postData}/>}
                    {view==='assets' && <AssetList data={data} selectedDept={selectedDept} setView={setView} setSelectedAsset={setSelectedAsset}/>}
                    {view==='global_search' && <GlobalSearch data={data} setView={setView} setSelectedAsset={setSelectedAsset}/>}
                    {view==='electrical' && <UtilityView data={data} type="electrical" setView={setView} setSelectedAsset={setSelectedAsset}/>}
                    {view==='water' && <UtilityView data={data} type="water" setView={setView} setSelectedAsset={setSelectedAsset}/>}
                    {(view==='add_asset'||view==='edit_asset') && <AddAssetView data={data} selectedDept={selectedDept} setView={setView} postData={postData} view={view} editItem={selectedAsset}/>}
                    {view==='detail' && <DetailView item={selectedAsset} setView={setView} postData={postData}/>}
                    {view==='executive' && <ExecutiveDashboard data={data}/>}
                </div>
            </main>
            <MobileNav view={view} setView={setView} pmOverdue={pmOverdue}/>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
