<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MTA Asset Maintenance (Desktop Only)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; opacity: 0; transform: translateY(10px); }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        
        .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        
        .input-box { width: 100%; padding: 0.75rem 1rem; border: 1px solid #e5e7eb; border-radius: 0.75rem; outline: none; transition: all 0.2s; background: #ffffff; color: #1f2937; }
        .input-box:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        .input-box:disabled { background-color: #f9fafb; color: #9ca3af; cursor: not-allowed; }
        
        .nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 0.75rem; color: #6b7280; font-weight: 500; transition: all 0.2s; cursor: pointer; }
        .nav-item:hover { background-color: #f3f4f6; color: #111827; }
        .nav-item.active { background-color: #eff6ff; color: #2563eb; font-weight: 600; }
        
        .pb-safe { padding-bottom: calc(20px + env(safe-area-inset-bottom)); } /* ลด Padding เพราะไม่มี Mobile Nav แล้ว */
        .scroll-container { -webkit-overflow-scrolling: touch; }
        
        .modal-enter { animation: modalIn 0.3s ease-out forwards; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 10px; }
    </style>
</head>
<body class="text-gray-800 h-screen overflow-hidden flex flex-row"> <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ***************************************************************
        // 🔴🔴🔴 ใส่ URL ของ Web App (Google Apps Script) ที่คุณ Deploy ล่าสุดตรงนี้ 🔴🔴🔴
        const API_URL = "https://script.google.com/macros/s/AKfycbxrg3L1Kvzbjh5U0WlFve8ExsGYcC8YTte2qB8Rs5Ckkza4aDjQ4QRFpCtz599s1NdE/exec"; 
        // ***************************************************************

        // --- Icons ---
        const Icon = ({ path, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{path}</svg>
        );
        const Icons = {
            Dashboard: <><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></>,
            Assets: <><path d="M2 12h20"></path><path d="M7 12v5a3 3 0 0 0 6 0v-5"></path><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M12 12V7"></path></>,
            Add: <><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></>,
            Refresh: <><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></>,
            Search: <><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></>,
            ArrowLeft: <><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></>,
            Image: <><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></>,
            File: <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></>,
            Close: <><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></>,
            Building: <><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="9" y1="22" x2="9" y2="22.01"></line><line x1="15" y1="22" x2="15" y2="22.01"></line><line x1="12" y1="22" x2="12" y2="22.01"></line><line x1="12" y1="2" x2="12" y2="22"></line><line x1="4" y1="10" x2="20" y2="10"></line><line x1="4" y1="16" x2="20" y2="16"></line></>,
            Wrench: <><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></>,
            Trash: <><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></>,
            Loader: <><path d="M21 12a9 9 0 1 1-6.219-8.56"/></>,
            Folder: <><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></>,
            Calendar: <><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></>,
            User: <><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></>,
            Phone: <><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></>,
            Clock: <><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></>,
            Alert: <><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></>
        };

        const fileToBase64 = (file) => new Promise((resolve, reject) => {
            if (file.size > 5 * 1024 * 1024) return alert("ไฟล์ต้องไม่เกิน 5MB");
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        const LoadingOverlay = ({ text }) => (
            <div className="fixed inset-0 bg-white/80 z-[60] flex flex-col items-center justify-center fade-in backdrop-blur-sm">
                <div className="animate-spin text-blue-600 mb-4"><Icon path={Icons.Loader} size={48} /></div>
                <p className="text-slate-600 font-bold text-lg">{text}</p>
            </div>
        );

        const getTaskCategory = (dateStr) => {
            if(!dateStr) return 'unknown';
            const today = new Date();
            today.setHours(0,0,0,0);
            const taskDate = new Date(dateStr);
            taskDate.setHours(0,0,0,0);
            const diffTime = taskDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
            if (diffDays < 0) return 'overdue';
            if (diffDays <= 7) return 'thisWeek';
            if (diffDays <= 14) return 'nextWeek';
            if (diffDays <= 30) return 'nextMonth';
            return 'future';
        };

        // --- COMPONENTS ---

        // 🟢 Sidebar (Always Visible now)
        const Sidebar = ({ setView, view }) => {
            const menus = [
                { id: 'dashboard', label: 'Dashboard', icon: Icons.Dashboard },
                { id: 'pm_dashboard', label: 'ภาพรวม PM', icon: Icons.Calendar },
                { id: 'departments', label: 'แผนก & อุปกรณ์', icon: Icons.Building },
            ];
            return (
                // ลบ hidden md:flex ออก เพื่อให้แสดงตลอด
                <div className="flex flex-col w-64 bg-white h-full border-r border-gray-200 p-4 shrink-0 shadow-sm z-20">
                    <div className="flex items-center gap-3 px-4 py-6 mb-4">
                       <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                         <Icon path={Icons.Wrench} size={24} />
                       </div>
                       <div>
                         <h1 className="font-bold text-xl text-gray-800">MTA Asset</h1>
                         <p className="text-xs text-gray-400">Maintenance System</p>
                       </div>
                    </div>
                    <div className="space-y-1">
                        {menus.map(m => (
                            <div key={m.id} 
                                onClick={() => setView(m.id)}
                                className={`nav-item ${view === m.id || (view.includes('asset') && m.id==='departments') || (view==='detail' && m.id==='departments') ? 'active' : ''}`}
                            >
                                <Icon path={m.icon} size={20} />
                                <span>{m.label}</span>
                            </div>
                        ))}
                    </div>
                    <div className="mt-auto pt-4 border-t border-gray-100">
                        <div className="text-xs text-gray-400 text-center">Version 1.0.0 (Desktop)</div>
                    </div>
                </div>
            );
        };

        // ❌ MobileNav (REMOVED) - ลบ Component นี้ทิ้งแล้ว

        const DashboardView = ({ data, setView }) => {
            const totalAssets = data.assets.length;
            const repairing = data.assets.filter(a => a.status === 'ส่งซ่อม').length;
            const active = totalAssets - repairing;
            return (
                <div className="p-6 md:p-10 w-full max-w-7xl mx-auto space-y-8 fade-in pb-safe">
                    <div className="flex justify-between items-end">
                        <div><h2 className="text-3xl font-bold text-gray-800">Dashboard</h2><p className="text-gray-500 mt-1">ภาพรวมสถานะทรัพย์สินทั้งหมด</p></div>
                        {/* ลบ hidden md:flex ออก */}
                        <button onClick={() => setView('add_asset')} className="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-semibold shadow-lg shadow-blue-200 transition active:scale-95">
                            <Icon path={Icons.Add} size={20}/> เพิ่มอุปกรณ์ใหม่
                        </button>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-5 card-hover"><div className="p-4 bg-blue-50 text-blue-600 rounded-2xl"><Icon path={Icons.Building} size={32}/></div><div><p className="text-gray-400 text-xs font-bold uppercase tracking-wider">ทั้งหมด</p><p className="text-3xl font-bold text-gray-800 mt-1">{totalAssets}</p></div></div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-5 card-hover"><div className="p-4 bg-orange-50 text-orange-600 rounded-2xl"><Icon path={Icons.Wrench} size={32}/></div><div><p className="text-gray-400 text-xs font-bold uppercase tracking-wider">กำลังซ่อม</p><p className="text-3xl font-bold text-orange-600 mt-1">{repairing}</p></div></div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-5 card-hover"><div className="p-4 bg-green-50 text-green-600 rounded-2xl"><Icon path={Icons.Assets} size={32}/></div><div><p className="text-gray-400 text-xs font-bold uppercase tracking-wider">ใช้งานปกติ</p><p className="text-3xl font-bold text-green-600 mt-1">{active}</p></div></div>
                    </div>
                </div>
            );
        };

        const PmDashboardView = ({ assets, setSelectedAsset, setView }) => {
            const [tasks, setTasks] = useState([]);
            const [loadingPm, setLoadingPm] = useState(false);
            const [search, setSearch] = useState('');

            useEffect(() => {
                const loadPmData = async () => {
                    setLoadingPm(true);
                    try {
                        const response = await fetch(API_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'get_all_pm_dashboard' })
                        });
                        const json = await response.json();
                        if (json.allPm) setTasks(json.allPm);
                    } catch (err) { console.log(err); }
                    setLoadingPm(false);
                };
                loadPmData();
            }, []);

            const filteredTasks = tasks.filter(t => 
                (String(t.assetName || "").toLowerCase().includes(search.toLowerCase()) || 
                 String(t.assetId || "").toLowerCase().includes(search.toLowerCase()))
            );

            const handleTaskClick = (assetId) => {
                const foundAsset = assets.find(a => String(a.id) === String(assetId));
                if (foundAsset) {
                    setSelectedAsset(foundAsset);
                    setView('detail');
                } else {
                    alert('ไม่พบข้อมูลอุปกรณ์นี้');
                }
            };

            const renderTaskSection = (title, category, colorClass, icon) => {
                const items = filteredTasks.filter(t => getTaskCategory(t.planDate) === category);
                if (items.length === 0) return null;
                return (
                    <div className="mb-8 animate-[fadeIn_0.3s_ease-out]">
                        <h3 className={`font-bold text-lg mb-4 flex items-center gap-2 ${colorClass}`}>
                            {icon} {title} <span className="bg-gray-100 text-gray-500 text-xs px-2 py-1 rounded-full">{items.length}</span>
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {items.map((t, i) => (
                                <div key={i} onClick={() => handleTaskClick(t.assetId)} className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm hover:shadow-lg transition border-l-4 cursor-pointer active:scale-95 transform" style={{borderLeftColor: colorClass.includes('red')?'#ef4444':colorClass.includes('orange')?'#f97316':'#3b82f6'}}>
                                    <div className="flex justify-between items-start mb-2">
                                        <div className="font-bold text-gray-800 text-sm">{t.assetName}</div>
                                        <div className="text-[10px] bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded font-mono">{t.assetId}</div>
                                    </div>
                                    <div className="text-gray-600 text-sm mb-2">{t.topic}</div>
                                    <div className="flex flex-col gap-1 text-xs">
                                        <div className="flex items-center gap-2">
                                            <span className="flex items-center gap-1 text-gray-500 bg-gray-50 px-2 py-1 rounded"><Icon path={Icons.Calendar} size={12}/> {t.planDate}</span>
                                            <span className={`px-2 py-1 rounded ${t.status==='ดำเนินการแล้ว'?'bg-green-100 text-green-700':'bg-yellow-50 text-yellow-700'}`}>{t.status}</span>
                                        </div>
                                        {t.pmType === 'ภายนอก' && (
                                            <div className="mt-1 flex flex-col gap-0.5 text-blue-600 bg-blue-50 p-2 rounded">
                                                <span className="font-bold flex items-center gap-1"><Icon path={Icons.Wrench} size={12}/> {t.pmVendorName}</span>
                                                {t.pmVendorContact && <a href={`tel:${t.pmVendorContact}`} onClick={(e)=>e.stopPropagation()} className="flex items-center gap-1 hover:underline"><Icon path={Icons.Phone} size={12}/> {t.pmVendorContact}</a>}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            return (
                <div className="p-6 md:p-10 w-full max-w-7xl mx-auto space-y-6 fade-in pb-safe h-full overflow-y-auto scroll-container">
                    <div className="flex flex-col md:flex-row justify-between items-end gap-4">
                        <div>
                            <h2 className="text-3xl font-bold text-gray-800">ภาพรวม PM</h2>
                            <p className="text-gray-500 mt-1">ตารางงานบำรุงรักษาเครื่องจักรทั้งหมด</p>
                        </div>
                        <div className="relative w-full md:w-80">
                            <div className="absolute left-4 top-3.5 text-gray-400"><Icon path={Icons.Search} size={18}/></div>
                            <input className="input-box pl-11" placeholder="ค้นหาชื่อเครื่อง / รหัส..." value={search} onChange={e => setSearch(e.target.value)} />
                        </div>
                    </div>
                    {loadingPm ? <div className="text-center py-20 text-gray-400 animate-pulse">กำลังโหลดข้อมูล...</div> : (
                        <div className="space-y-2">
                            {tasks.length === 0 && <div className="text-center py-20 text-gray-400">ยังไม่มีข้อมูลตารางงาน</div>}
                            {renderTaskSection("เกินกำหนด / วันนี้", "overdue", "text-red-600", <Icon path={Icons.Clock} size={20}/>)}
                            {renderTaskSection("สัปดาห์นี้ (This Week)", "thisWeek", "text-red-500", <Icon path={Icons.Calendar} size={20}/>)}
                            {renderTaskSection("สัปดาห์หน้า (Next Week)", "nextWeek", "text-orange-500", <Icon path={Icons.Calendar} size={20}/>)}
                            {renderTaskSection("เดือนหน้า (Next Month)", "nextMonth", "text-blue-500", <Icon path={Icons.Calendar} size={20}/>)}
                            {renderTaskSection("อนาคต", "future", "text-gray-500", <Icon path={Icons.Calendar} size={20}/>)}
                        </div>
                    )}
                </div>
            );
        };

        const DepartmentView = ({ data, setSelectedDept, setView, postData }) => {
            const [showDeptModal, setShowDeptModal] = useState(false);
            const [newDept, setNewDept] = useState({ name: '', code: '' });
            return (
                <div className="p-6 md:p-10 w-full max-w-7xl mx-auto h-full flex flex-col pb-safe fade-in">
                    <div className="flex justify-between items-center mb-8">
                        <div><h2 className="text-2xl md:text-3xl font-bold text-gray-800">แผนก (Departments)</h2><p className="text-gray-500 text-sm mt-1">เลือกแผนกเพื่อดูอุปกรณ์ภายใน</p></div>
                        <button onClick={() => setShowDeptModal(true)} className="bg-white border border-gray-200 text-gray-600 hover:text-blue-600 hover:border-blue-300 px-4 py-2 rounded-xl text-sm font-bold flex gap-2 shadow-sm transition items-center">
                            <Icon path={Icons.Add} size={18}/> <span>เพิ่มแผนก</span>
                        </button>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 overflow-y-auto pb-10">
                        {data.departments.map(dept => (
                            <div key={dept.name} onClick={() => { setSelectedDept(dept.name); setView('assets'); }} className="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex flex-col items-center justify-center cursor-pointer card-hover gap-3 h-48 relative group"><div className="absolute top-3 right-3 text-[10px] font-mono font-bold text-gray-400 bg-gray-50 px-2 py-1 rounded border border-gray-100 group-hover:bg-blue-50 group-hover:text-blue-500 transition">{dept.code}</div><div className="bg-blue-50 text-blue-500 p-4 rounded-full mb-2 group-hover:scale-110 transition"><Icon path={Icons.Building} size={32}/></div><span className="font-bold text-gray-800 text-lg text-center">{dept.name}</span><span className="bg-gray-100 px-3 py-1 rounded-full text-xs font-bold text-gray-500">{data.assets.filter(a => a.location === dept.name).length} อุปกรณ์</span></div>
                        ))}
                    </div>
                    {showDeptModal && (<div className="fixed inset-0 bg-black/40 z-[60] flex items-center justify-center p-4 backdrop-blur-sm fade-in"><div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl relative animate-[scaleIn_0.2s_ease-out]"><button onClick={() => setShowDeptModal(false)} className="absolute top-4 right-4 bg-gray-100 p-2 rounded-full hover:bg-gray-200 transition"><Icon path={Icons.Close} size={20}/></button><h3 className="font-bold text-xl text-gray-800 mb-6">สร้างแผนกใหม่</h3><div className="space-y-4"><div><label className="text-sm font-bold text-gray-500 mb-1.5 block">ชื่อแผนก</label><input className="input-box" placeholder="เช่น ฝ่ายผลิต" value={newDept.name} onChange={e => setNewDept({ ...newDept, name: e.target.value })} /></div><div><label className="text-sm font-bold text-gray-500 mb-1.5 block">รหัสย่อ (3 ตัวอักษร)</label><input className="input-box uppercase font-mono" placeholder="เช่น PD" maxLength="3" value={newDept.code} onChange={e => setNewDept({ ...newDept, code: e.target.value.toUpperCase() })} /></div><button onClick={() => { if (newDept.name && newDept.code) { postData({ action: 'save_dept', ...newDept }); setShowDeptModal(false); } else alert('กรุณากรอกข้อมูลให้ครบ'); }} className="w-full bg-blue-600 text-white py-3.5 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition mt-2">ยืนยันการสร้าง</button></div></div></div>)}
                </div>
            );
        };

        const AssetListView = ({ data, selectedDept, setView, setSelectedAsset }) => {
            const [term, setTerm] = useState('');
            
            const filtered = data.assets.filter(a => {
                const name = a.name ? String(a.name).toLowerCase() : "";
                const id = a.id ? String(a.id).toLowerCase() : "";
                const searchTerm = term.toLowerCase();
                return a.location === selectedDept && (name.includes(searchTerm) || id.includes(searchTerm));
            });

            return (
                <div className="p-6 md:p-10 w-full max-w-7xl mx-auto h-full flex flex-col pb-safe fade-in">
                    <div className="flex flex-col md:flex-row md:items-center gap-4 mb-8">
                        <div className="flex items-center gap-4 flex-1">
                            <button onClick={() => setView('departments')} className="p-2.5 bg-white rounded-xl border shadow-sm text-gray-600 hover:bg-gray-50 transition"><Icon path={Icons.ArrowLeft} size={20}/></button>
                            <h2 className="text-2xl font-bold truncate text-gray-800">{selectedDept}</h2>
                        </div>
                        <div className="relative w-full md:w-96"><div className="absolute left-4 top-3.5 text-gray-400"><Icon path={Icons.Search} size={18}/></div><input className="input-box pl-11 shadow-sm border-0" placeholder="ค้นหาชื่อ หรือ รหัส..." value={term} onChange={e => setTerm(e.target.value)}/></div>
                        {/* ลบ hidden md:flex ออก */}
                        <button onClick={() => setView('add_asset')} className="flex bg-blue-600 text-white px-5 py-2.5 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition items-center gap-2">
                            <Icon path={Icons.Add} size={20}/> เพิ่มอุปกรณ์
                        </button>
                    </div>
                    
                    {/* ลบปุ่ม Mobile Only Add Asset ออก */}
                    
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 overflow-y-auto pb-10">
                        {filtered.map(item => (
                            <div key={item.id} onClick={() => { setSelectedAsset(item); setView('detail'); }} className="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm flex flex-col gap-3 cursor-pointer card-hover h-full group relative overflow-hidden">
                                {!item.nextPmDate && (
                                    <div className="absolute top-2 left-2 z-10 bg-red-100 text-red-600 text-[10px] font-bold px-2 py-1 rounded-full shadow-sm flex items-center gap-1 border border-red-200">
                                        <Icon path={Icons.Alert} size={10}/> ไม่มีแผน PM
                                    </div>
                                )}
                                <div className="w-full h-40 bg-gray-50 rounded-xl overflow-hidden border border-gray-200 relative">
                                    {item.image ? <img src={item.image} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" /> : <div className="flex items-center justify-center h-full text-gray-300"><Icon path={Icons.Image} size={40}/></div>}
                                    <div className={`absolute top-2 right-2 px-2 py-1 rounded-lg text-[10px] font-bold shadow-sm backdrop-blur-sm ${item.status === 'ปกติ' ? 'bg-white/90 text-green-600' : 'bg-orange-500 text-white'}`}>{item.status}</div>
                                </div>
                                <div>
                                    <div className="font-bold text-gray-800 text-lg truncate">{item.name}</div>
                                    <div className="text-xs text-gray-400 font-mono mb-2">{item.id}</div>
                                    <div className="text-sm text-gray-500 bg-gray-50 px-2 py-1 rounded inline-block">{item.model || '-'}</div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const AddAssetView = ({ data, selectedDept, setView, postData }) => {
            const [form, setForm] = useState({ id: 'รอสร้างอัตโนมัติ...', name: '', model: '', location: selectedDept || '', status: 'ปกติ', purchaseDate: new Date().toISOString().split('T')[0], vendor: '', image: '', receiptPdf: '' });
            const handleFile = async (e, k) => { if (e.target.files[0]) setForm({ ...form, [k]: await fileToBase64(e.target.files[0]) }) };
            
            useEffect(() => {
                if (form.location) {
                    const deptObj = data.departments.find(d => d.name === form.location);
                    if (deptObj) {
                        const code = deptObj.code;
                        const year = new Date().getFullYear();
                        const prefix = `MTA-${code}-${year}-`;
                        const existingIds = data.assets.filter(a => a.id && a.id.startsWith(prefix)).map(a => parseInt(a.id.split('-').pop()));
                        const nextNum = existingIds.length > 0 ? Math.max(...existingIds) + 1 : 1;
                        setForm(prev => ({ ...prev, id: `${prefix}${String(nextNum).padStart(4, '0')}` }));
                    }
                }
            }, [form.location]);

            return (
                <div className="p-6 md:p-10 w-full max-w-4xl mx-auto h-full flex flex-col pb-safe fade-in overflow-y-auto scroll-container">
                    <div className="flex items-center gap-4 mb-8"><button onClick={() => setView('departments')} className="p-3 bg-white rounded-xl border shadow-sm text-gray-600 hover:bg-gray-50"><Icon path={Icons.ArrowLeft} size={20}/></button><h2 className="text-2xl font-bold text-gray-800">เพิ่มอุปกรณ์ใหม่</h2></div>
                    <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-gray-100 flex flex-col md:flex-row gap-8">
                        <div className="w-full md:w-1/3">
                            <div className="aspect-square bg-gray-50 border-2 border-dashed border-gray-300 rounded-2xl flex flex-col items-center justify-center relative overflow-hidden hover:bg-gray-100 transition group cursor-pointer">{form.image ? <img src={form.image} className="w-full h-full object-cover" /> : <div className="text-gray-400 text-sm flex flex-col items-center font-bold gap-2"><Icon path={Icons.Image} size={48} className="text-gray-300 group-hover:text-blue-400 transition"/>คลิกเพิ่มรูปภาพ</div>}<input type="file" accept="image/*" className="absolute inset-0 opacity-0 cursor-pointer" onChange={e => handleFile(e, 'image')} /></div>
                        </div>
                        <div className="flex-1 space-y-5">
                            <div><label className="text-sm font-bold text-gray-600 mb-1.5 block">ชื่ออุปกรณ์ *</label><input className="input-box" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} /></div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4"><div><label className="text-sm font-bold text-gray-600 mb-1.5 block">รหัสทรัพย์สิน (Auto)</label><input className="input-box bg-gray-100 text-gray-500 font-mono font-bold border-transparent" value={form.id} disabled /></div><div><label className="text-sm font-bold text-gray-600 mb-1.5 block">รุ่น / Model</label><input className="input-box" value={form.model} onChange={e => setForm({ ...form, model: e.target.value })} /></div></div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4"><div><label className="text-sm font-bold text-gray-600 mb-1.5 block">แผนก</label><select className="input-box" value={form.location} onChange={e => setForm({ ...form, location: e.target.value })}><option value="">-- เลือกแผนก --</option>{data.departments.map(d => <option key={d.name} value={d.name}>{d.name} ({d.code})</option>)}</select></div><div><label className="text-sm font-bold text-gray-600 mb-1.5 block">สถานะ</label><select className="input-box" value={form.status} onChange={e => setForm({ ...form, status: e.target.value })}><option>ปกติ</option><option>ส่งซ่อม</option><option>เสีย</option></select></div></div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4"><div><label className="text-sm font-bold text-gray-600 mb-1.5 block">วันที่ซื้อ</label><input type="date" className="input-box" value={form.purchaseDate} onChange={e => setForm({ ...form, purchaseDate: e.target.value })} /></div><div><label className="text-sm font-bold text-gray-600 mb-1.5 block">ผู้จำหน่าย</label><input className="input-box" placeholder="ร้านค้า/บริษัทที่ซื้อ" value={form.vendor} onChange={e => setForm({ ...form, vendor: e.target.value })} /></div></div>
                            <div className="bg-orange-50 p-4 rounded-xl border border-orange-100 text-sm text-orange-800 flex items-center justify-between"><span className="font-bold flex items-center gap-2"><Icon path={Icons.File} size={18}/> แนบใบเสร็จ (PDF)</span><label className="bg-white border border-orange-200 text-orange-600 px-3 py-1.5 rounded-lg cursor-pointer hover:bg-orange-50 transition text-xs font-bold shadow-sm">{form.receiptPdf ? 'เปลี่ยนไฟล์' : 'เลือกไฟล์'}<input type="file" accept="application/pdf" className="hidden" onChange={e => handleFile(e, 'receiptPdf')} /></label></div>
                            <button onClick={() => postData({ action: 'save_asset', ...form })} className="w-full bg-slate-900 hover:bg-black text-white py-4 rounded-xl font-bold shadow-lg shadow-gray-300 transition mt-4 text-lg">บันทึกข้อมูล</button>
                        </div>
                    </div>
                </div>
            );
        };

        const DetailAssetView = ({ item, setView, postData }) => { 
            // Safety Check
            if (!item) return <div className="p-10 text-center text-gray-400">ไม่พบข้อมูลอุปกรณ์</div>;

            const [tab, setTab] = useState('history'); 
            const [log, setLog] = useState({ date: new Date().toISOString().split('T')[0], type: 'ซ่อมแซม', description: '', labor: '', parts: [] }); 
            const [part, setPart] = useState({ name: '', price: '', image: '', pdf: '' }); 
            const [selLog, setSelLog] = useState(null); 
            const [fileLoading, setFileLoading] = useState(false); 
            const [pmList, setPmList] = useState([]); 
            const [pmLoading, setPmLoading] = useState(false); 
            const [pmForm, setPmForm] = useState({ schId: null, topic: '', planDate: '', status: 'รอเป้าหมาย', note: '', pmType: 'ภายใน', pmVendorName: '', pmVendorContact: '' }); 
            const [isEditingPm, setIsEditingPm] = useState(false); 
            const [showImageModal, setShowImageModal] = useState(false);
            
            useEffect(() => { 
                if (tab === 'pmschedule') { fetchPmSchedules(); } 
            }, [tab, item.id]); 

            const fetchPmSchedules = async () => { setPmLoading(true); try { const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'get_pm_schedules', assetId: item.id }) }); const json = await response.json(); if (json.pmSchedules) setPmList(json.pmSchedules); } catch (err) { console.error(err); } setPmLoading(false); }; 
            const savePm = async () => { if (!pmForm.topic || !pmForm.planDate) return alert("ระบุหัวข้อและวันที่"); setPmLoading(true); await postData({ action: 'save_pm_schedule', assetId: item.id, assetName: item.name, schedule: pmForm }); setPmForm({ schId: null, topic: '', planDate: '', status: 'รอเป้าหมาย', note: '', pmType: 'ภายใน', pmVendorName: '', pmVendorContact: '' }); setIsEditingPm(false); setTimeout(fetchPmSchedules, 2000); }; 
            const deletePm = async (schId) => { if(!confirm("ลบรายการนี้?")) return; setPmLoading(true); await postData({ action: 'delete_pm_schedule', assetId: item.id, schId: schId }); setTimeout(fetchPmSchedules, 2000); }; 
            const handlePartFile = async (e, k) => { if (e.target.files[0]) { setFileLoading(true); try { const base64 = await fileToBase64(e.target.files[0]); if (base64) { setPart(prev => ({ ...prev, [k]: base64 })); alert("แนบไฟล์สำเร็จ!"); } } catch (err) { alert("Error reading file"); } finally { setFileLoading(false); } } }; 
            const addPart = () => { if (part.name) { setLog(prev => ({ ...prev, parts: [...prev.parts, part] })); setPart({ name: '', price: '', image: '', pdf: '' }); } else { alert("กรุณาระบุชื่ออะไหล่"); } }; 
            const submitLog = () => { const total = Number(log.labor) + log.parts.reduce((s, p) => s + Number(p.price), 0); let finalParts = [...log.parts]; if (part.name) finalParts.push(part); const newLog = { id: Date.now(), date: log.date, type: log.type, description: log.description, laborCost: log.labor, totalCost: total + (part.name ? Number(part.price) : 0), parts: finalParts }; postData({ action: 'save_log', assetId: item.id, log: newLog }); }; 
            
            return (
                <div className="w-full h-full flex flex-col bg-gray-50 relative overflow-y-auto pb-safe fade-in p-6 md:p-10 scroll-container">
                    <div className="flex items-center gap-4 mb-6">
                        <button onClick={() => setView('assets')} className="p-3 bg-white rounded-xl border shadow-sm text-gray-600 hover:bg-gray-50"><Icon path={Icons.ArrowLeft} size={20}/></button>
                        <div>
                            <h1 className="text-3xl font-bold text-gray-800">{item.name}</h1>
                            <div className="text-gray-500 text-sm flex gap-3 mt-1 font-mono">
                                <span>{item.id}</span>
                                <span>• {item.model}</span>
                                <span className={`px-2 rounded text-xs font-bold flex items-center ${item.status === 'ปกติ' ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700'}`}>{item.status}</span>
                            </div>
                        </div>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-6">
                        <div className="w-full lg:w-1/3 space-y-4">
                            <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col gap-4">
                                <div 
                                    className="aspect-square bg-gray-100 rounded-xl overflow-hidden cursor-pointer relative group"
                                    onClick={() => setShowImageModal(true)}
                                >
                                    {item.image ? <img src={item.image} className="w-full h-full object-cover transition duration-300 group-hover:opacity-90" /> : <div className="flex items-center justify-center h-full text-gray-300"><Icon path={Icons.Image} size={64}/></div>}
                                    {item.image && <div className="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white font-bold"><Icon path={Icons.Search} size={24}/> ขยายรูป</div>}
                                </div>
                                <div className="space-y-3 text-sm text-gray-600">
                                    <div className="flex justify-between border-b pb-2"><span>แผนก</span><span className="font-bold text-gray-900">{item.location}</span></div>
                                    <div className="flex justify-between border-b pb-2"><span>วันที่ซื้อ</span><span className="font-bold text-gray-900">{item.purchaseDate}</span></div>
                                    <div className="flex justify-between border-b pb-2"><span>ผู้จำหน่าย</span><span className="font-bold text-gray-900">{item.vendor || '-'}</span></div>
                                    {item.receiptPdf && <a href={item.receiptPdf} target="_blank" className="flex items-center justify-center gap-2 w-full py-3 mt-2 bg-orange-50 text-orange-700 rounded-xl font-bold hover:bg-orange-100 transition"><Icon path={Icons.File} size={18}/> ดูใบเสร็จ</a>}
                                </div>
                                <button onClick={() => { if (confirm('ลบอุปกรณ์นี้ถาวร?')) postData({ action: 'delete_asset', id: item.id }); }} className="w-full mt-2 text-red-500 text-sm font-bold hover:bg-red-50 py-3 rounded-xl transition flex justify-center gap-2"><Icon path={Icons.Trash} size={18}/> ลบอุปกรณ์</button>
                            </div>
                        </div>
                        
                        <div className="w-full lg:w-2/3">
                            <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden min-h-[600px]">
                                <div className="flex border-b border-gray-100 overflow-x-auto whitespace-nowrap scroll-container">
                                    <button onClick={() => setTab('history')} className={`flex-1 min-w-[100px] py-4 text-sm font-bold border-b-2 transition ${tab === 'history' ? 'border-blue-600 text-blue-600 bg-blue-50/50' : 'border-transparent text-gray-400 hover:text-gray-600'}`}>ประวัติซ่อม ({item.history?.length || 0})</button>
                                    <button onClick={() => setTab('newlog')} className={`flex-1 min-w-[100px] py-4 text-sm font-bold border-b-2 transition ${tab === 'newlog' ? 'border-blue-600 text-blue-600 bg-blue-50/50' : 'border-transparent text-gray-400 hover:text-gray-600'}`}>+ บันทึกซ่อม</button>
                                    <button onClick={() => setTab('pmschedule')} className={`flex-1 min-w-[100px] py-4 text-sm font-bold border-b-2 transition ${tab === 'pmschedule' ? 'border-blue-600 text-blue-600 bg-blue-50/50' : 'border-transparent text-gray-400 hover:text-gray-600'}`}>📅 ตาราง PM</button>
                                </div>

                                <div className="p-6">
                                    {tab === 'newlog' && (<div className="animate-[fadeIn_0.3s_ease-out]"><div className="grid grid-cols-2 gap-4 mb-4"><div><label className="text-xs font-bold text-gray-500 mb-1.5 block">วันที่</label><input type="date" className="input-box" value={log.date} onChange={e => setLog({ ...log, date: e.target.value })} /></div><div><label className="text-xs font-bold text-gray-500 mb-1.5 block">ประเภท</label><select className="input-box" value={log.type} onChange={e => setLog({ ...log, type: e.target.value })}><option>ซ่อมแซม</option><option>บำรุงรักษา</option></select></div></div><div className="mb-6"><label className="text-xs font-bold text-gray-500 mb-1.5 block">อาการ / รายละเอียด</label><textarea className="input-box" rows="3" placeholder="ระบุอาการ..." onChange={e => setLog({ ...log, description: e.target.value })}></textarea></div><div className="bg-gray-50 p-5 rounded-2xl border border-gray-200 mb-6 relative"><p className="text-xs font-bold text-gray-400 mb-3 uppercase tracking-wider">เพิ่มรายการอะไหล่</p><div className="flex flex-wrap gap-2 mb-3 items-center"><input className="input-box p-2 text-sm flex-1 min-w-[120px]" placeholder="ชื่ออะไหล่" value={part.name} onChange={e => setPart({ ...part, name: e.target.value })} /><input className="input-box p-2 text-sm w-24" type="number" placeholder="ราคา" value={part.price} onChange={e => setPart({ ...part, price: e.target.value })} /><label className={`border p-2 rounded-lg cursor-pointer transition ${part.image ? 'bg-green-100 text-green-700 border-green-300' : 'bg-white hover:bg-gray-100'}`} title="แนบรูป"><Icon path={Icons.Image} size={18}/><input type="file" className="hidden" accept="image/*" onChange={e => handlePartFile(e, 'image')} /></label><label className={`border p-2 rounded-lg cursor-pointer transition ${part.pdf ? 'bg-green-100 text-green-700 border-green-300' : 'bg-white hover:bg-gray-100'}`} title="แนบ PDF"><Icon path={Icons.File} size={18}/><input type="file" className="hidden" accept="application/pdf" onChange={e => handlePartFile(e, 'pdf')} /></label><button onClick={addPart} className="bg-slate-800 text-white px-3 py-2 rounded-lg hover:bg-black flex items-center justify-center gap-1 transition text-xs font-bold min-w-[60px]"><Icon path={Icons.Add} size={16}/> เพิ่ม</button></div>{fileLoading && <div className="text-xs text-blue-500 animate-pulse mb-2 font-bold">กำลังอัปโหลดไฟล์...</div>}<div className="space-y-2">{log.parts.map((p, i) => (<div key={i} className="text-xs flex justify-between p-3 bg-white rounded-xl border font-medium shadow-sm items-center"><div className="flex items-center gap-2"><span className="font-bold text-gray-700">{p.name}</span>{p.image && <Icon path={Icons.Image} size={12} className="text-blue-500"/>}{p.pdf && <Icon path={Icons.File} size={12} className="text-orange-500"/>}</div><span>฿{Number(p.price).toLocaleString()}</span></div>))}</div></div><div className="mb-6"><label className="text-xs font-bold text-gray-500 mb-1.5 block">ค่าแรงช่าง (บาท)</label><input type="number" className="input-box" placeholder="0.00" onChange={e => setLog({ ...log, labor: e.target.value })} /></div><button onClick={submitLog} disabled={fileLoading} className={`w-full text-white py-3.5 rounded-xl font-bold shadow-lg transition ${fileLoading ? 'bg-gray-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'}`}>บันทึกประวัติ</button></div>)}
                                    {tab === 'history' && (<div className="space-y-4 animate-[fadeIn_0.3s_ease-out]">{item.history && item.history.map((h, i) => (<div key={i} onClick={() => setSelLog(h)} className="bg-white border border-gray-100 rounded-2xl p-5 cursor-pointer hover:border-blue-400 hover:shadow-md transition group"><div className="flex justify-between items-start mb-2"><div><div className="text-xs font-bold text-gray-400 flex items-center gap-2 mb-1">{h.date} <span className="px-2 py-0.5 bg-gray-100 rounded text-gray-600">{h.type}</span></div><div className="font-bold text-gray-800 text-lg">{h.description}</div></div><div className="text-right"><div className="font-bold text-blue-600 text-lg">฿{Number(h.totalCost).toLocaleString()}</div></div></div>{h.parts?.length > 0 && <div className="text-xs text-gray-500 mt-2 bg-gray-50 p-2 rounded-lg inline-block border border-gray-100">ใช้อะไหล่ {h.parts.length} รายการ</div>}</div>))}{(!item.history || item.history.length === 0) && <div className="text-center text-gray-400 py-12 flex flex-col items-center"><Icon path={Icons.Folder} size={48} className="mb-2 opacity-30"/><p>ยังไม่มีประวัติการซ่อม</p></div>}</div>)}
                                    {tab === 'pmschedule' && (<div className="animate-[fadeIn_0.3s_ease-out]"><div className="bg-blue-50 p-4 rounded-xl border border-blue-100 mb-6"><h4 className="font-bold text-blue-800 mb-3 flex items-center gap-2"><Icon path={Icons.Calendar} size={18}/> {isEditingPm ? 'แก้ไขตารางงาน' : 'เพิ่มตารางงานใหม่'}</h4><div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3"><input type="date" className="input-box" value={pmForm.planDate} onChange={e => setPmForm({...pmForm, planDate: e.target.value})} /><input type="text" className="input-box" placeholder="หัวข้อการ PM..." value={pmForm.topic} onChange={e => setPmForm({...pmForm, topic: e.target.value})} /></div><div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3"><select className="input-box" value={pmForm.status} onChange={e => setPmForm({...pmForm, status: e.target.value})}><option>รอเป้าหมาย</option><option>ดำเนินการแล้ว</option><option>ยกเลิก</option></select><input type="text" className="input-box" placeholder="หมายเหตุ (ถ้ามี)" value={pmForm.note} onChange={e => setPmForm({...pmForm, note: e.target.value})} /></div><div className="bg-white p-3 rounded-lg border border-blue-100 mb-3"><div className="text-xs font-bold text-blue-500 mb-2">ผู้รับผิดชอบงาน PM</div><div className="grid grid-cols-1 md:grid-cols-2 gap-3"><select className="input-box" value={pmForm.pmType} onChange={e => setPmForm({...pmForm, pmType: e.target.value})}><option value="ภายใน">ภายใน (ทีมงานบริษัท)</option><option value="ภายนอก">ภายนอก (Supplier)</option></select>{pmForm.pmType === 'ภายนอก' && (<div className="col-span-1 md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-3 animate-[fadeIn_0.2s_ease-out]"><input type="text" className="input-box" placeholder="ชื่อช่าง / บริษัท" value={pmForm.pmVendorName} onChange={e => setPmForm({...pmForm, pmVendorName: e.target.value})} /><input type="text" className="input-box" placeholder="เบอร์ติดต่อ" value={pmForm.pmVendorContact} onChange={e => setPmForm({...pmForm, pmVendorContact: e.target.value})} /></div>)}</div></div><div className="flex gap-2"><button onClick={savePm} disabled={pmLoading} className="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold shadow hover:bg-blue-700 transition flex-1">บันทึก</button>{isEditingPm && <button onClick={() => { setIsEditingPm(false); setPmForm({ schId: null, topic: '', planDate: '', status: 'รอเป้าหมาย', note: '', pmType: 'ภายใน', pmVendorName: '', pmVendorContact: '' }); }} className="bg-gray-200 text-gray-600 px-4 py-2 rounded-lg font-bold hover:bg-gray-300 transition">ยกเลิก</button>}</div></div>{pmLoading ? <div className="text-center py-10 text-gray-400 animate-pulse">กำลังโหลดตารางงาน...</div> : (<div className="space-y-3">{pmList.length === 0 && <div className="text-center text-gray-400 py-10">ยังไม่มีตารางงาน</div>}{pmList.map((pm, i) => (<div key={i} className="bg-white border border-gray-100 p-4 rounded-xl flex justify-between items-center hover:shadow-md transition group"><div><div className="flex items-center gap-2 mb-1"><span className="font-mono text-blue-600 bg-blue-50 px-2 py-0.5 rounded text-sm font-bold">{pm.planDate}</span><span className={`text-xs px-2 py-0.5 rounded border ${pm.status==='ดำเนินการแล้ว'?'bg-green-50 text-green-600 border-green-200':'bg-gray-50 text-gray-500 border-gray-200'}`}>{pm.status}</span></div><div className="font-bold text-gray-800">{pm.topic}</div><div className="text-xs text-gray-500 mt-1 flex gap-2"><span>{pm.note}</span>{pm.pmType === 'ภายนอก' && <span className="text-blue-500 font-bold bg-blue-50 px-1 rounded">🔧 {pm.pmVendorName}</span>}</div></div><div className="flex gap-2 opacity-100 md:opacity-50 md:group-hover:opacity-100 transition"><button onClick={() => { setPmForm(pm); setIsEditingPm(true); }} className="p-2 hover:bg-gray-100 rounded text-blue-500"><Icon path={Icons.Wrench} size={16}/></button><button onClick={() => deletePm(pm.schId)} className="p-2 hover:bg-red-50 rounded text-red-500"><Icon path={Icons.Trash} size={16}/></button></div></div>))}</div>)}</div>)}
                                </div>
                            </div>
                        </div>

                        {showImageModal && item.image && (
                            <div className="fixed inset-0 z-[70] bg-black/90 flex items-center justify-center p-4 cursor-pointer modal-enter" onClick={() => setShowImageModal(false)}>
                                <div className="relative max-w-4xl max-h-screen">
                                    <button onClick={() => setShowImageModal(false)} className="absolute -top-10 right-0 text-white hover:text-gray-300"><Icon path={Icons.Close} size={32}/></button>
                                    <img src={item.image} className="max-h-[90vh] max-w-full rounded-lg shadow-2xl object-contain" onClick={(e) => e.stopPropagation()}/>
                                </div>
                            </div>
                        )}

                        {selLog && (<div className="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4 backdrop-blur-sm fade-in"><div className="bg-white w-full max-w-lg rounded-3xl p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto"><button onClick={() => setSelLog(null)} className="absolute top-4 right-4 bg-gray-100 p-2 rounded-full hover:bg-gray-200 transition"><Icon path={Icons.Close} size={20}/></button><div className="mb-6 border-b pb-4"><div className="text-gray-500 text-sm font-medium">{selLog.date}</div><h3 className="font-bold text-2xl text-gray-900 mt-1">{selLog.type}</h3></div><div className="space-y-6"><div><span className="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-2">อาการ / รายละเอียด</span><div className="bg-gray-50 p-4 rounded-xl text-gray-700 border border-gray-100 font-medium">{selLog.description}</div></div><div><span className="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-2">รายการอะไหล่</span><div className="border border-gray-200 rounded-xl overflow-hidden bg-gray-50">{selLog.parts?.map((p, i) => (<div key={i} className="flex flex-col p-4 border-b last:border-0 border-gray-200 bg-white"><div className="flex justify-between items-center mb-2"><span className="font-bold text-gray-800">{p.name}</span><span className="font-mono text-gray-600 font-bold">฿{Number(p.price).toLocaleString()}</span></div><div className="flex gap-2">{p.image && <a href={p.image} target="_blank" className="text-xs bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg hover:bg-blue-100 transition flex items-center gap-1 font-bold"><Icon path={Icons.Image} size={14}/> ดูรูป</a>}{p.pdf && <a href={p.pdf} target="_blank" className="text-xs bg-orange-50 text-orange-600 px-3 py-1.5 rounded-lg hover:bg-orange-100 transition flex items-center gap-1 font-bold"><Icon path={Icons.File} size={14}/> เปิด PDF</a>}</div></div>))}{(!selLog.parts || selLog.parts.length === 0) && <div className="p-6 text-center text-gray-400 text-sm">ไม่มีรายการอะไหล่</div>}</div></div><div className="flex justify-between items-center pt-4 border-t border-gray-100"><div className="text-sm text-gray-500 font-medium">ค่าแรงช่าง ฿{Number(selLog.laborCost).toLocaleString()}</div><div className="text-xl font-bold text-slate-900">รวม ฿{Number(selLog.totalCost).toLocaleString()}</div></div><button onClick={() => { if (confirm('ยืนยันลบประวัตินี้?')) { postData({ action: 'delete_log', assetId: item.id, logId: selLog.id }); setSelLog(null); } }} className="w-full py-3 bg-red-50 text-red-500 font-bold rounded-xl hover:bg-red-100 transition text-sm">ลบรายการนี้</button></div></div></div>)}</div>; 
        };

        // --- App Component ---
        const App = () => {
            const [view, setView] = useState('dashboard');
            const [data, setData] = useState({ assets: [], departments: [] });
            const [loading, setLoading] = useState(false);
            const [submitting, setSubmitting] = useState(false);
            const [selectedDept, setSelectedDept] = useState(null);
            const [selectedAsset, setSelectedAsset] = useState(null);

            useEffect(() => { 
                if (API_URL.includes("URL_FROM")) {
                    alert("กรุณาแก้ไขลิงก์ API_URL ในโค้ดก่อนใช้งานครับ!");
                } else {
                    fetchData(); 
                }
            }, []);

            useEffect(() => {
                if (selectedAsset && data.assets.length > 0) {
                    const updated = data.assets.find(a => String(a.id) === String(selectedAsset.id));
                    if (updated) setSelectedAsset(updated);
                }
            }, [data.assets]);

            const fetchData = async () => {
                setLoading(true);
                try {
                    const res = await fetch(API_URL);
                    const json = await res.json();
                    if(json.assets) setData({ assets: json.assets, departments: json.departments || [] });
                } catch (err) { console.error("Fetch Error:", err); }
                finally { setLoading(false); }
            };

            const postData = async (payload) => {
                setSubmitting(true);
                try {
                    await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                    setTimeout(() => {
                        if (!['save_pm_schedule', 'delete_pm_schedule'].includes(payload.action)) fetchData();
                        setSubmitting(false);
                        if(payload.action === 'save_asset') { setView('assets'); alert('บันทึกอุปกรณ์เรียบร้อย'); }
                        if(payload.action === 'save_log') alert('บันทึกประวัติเรียบร้อย');
                        if(payload.action === 'save_dept') { alert('สร้างแผนกเรียบร้อย'); }
                        if(payload.action.includes('delete') && !payload.action.includes('pm')) { setView('assets'); alert('ลบเรียบร้อย'); }
                        if(payload.action.includes('pm_schedule')) alert('ดำเนินการเรียบร้อย');
                    }, 2500);
                } catch (err) { alert("Error: " + err.message); setSubmitting(false); }
            };

            return (
                // 🟢 Flex Row เพื่อให้ Sidebar อยู่ซ้ายเสมอ
                <div className="flex h-screen w-full bg-slate-50 overflow-hidden text-gray-800">
                    {(loading || submitting) && <LoadingOverlay text={submitting ? 'กำลังบันทึกและอัปโหลด...' : 'กำลังดึงข้อมูล...'}/>}
                    
                    {/* Sidebar จะแสดงตลอดเวลา */}
                    <Sidebar setView={setView} view={view} fetchData={fetchData} />
                    
                    <main className="flex-1 h-full relative overflow-hidden flex flex-col bg-[#f8fafc]">
                        {view === 'dashboard' && <DashboardView data={data} setView={setView} />}
                        {view === 'departments' && <DepartmentView data={data} setSelectedDept={setSelectedDept} setView={setView} postData={postData} />}
                        {view === 'assets' && <AssetListView data={data} selectedDept={selectedDept} setView={setView} setSelectedAsset={setSelectedAsset} />}
                        {view === 'add_asset' && <AddAssetView data={data} selectedDept={selectedDept} setView={setView} postData={postData} />}
                        {view === 'detail' && <DetailAssetView item={selectedAsset} setView={setView} postData={postData} />}
                        {view === 'pm_dashboard' && <PmDashboardView assets={data.assets} setSelectedAsset={setSelectedAsset} setView={setView} />}
                    </main>
                    
                    {/* ❌ MobileNav ถูกลบออกแล้ว */}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
